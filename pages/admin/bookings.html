<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Manajemen Pemesanan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    body.ec-loading { visibility: hidden; }
    .filter-chip { padding:0.375rem 0.875rem;border-radius:999px;border:1.5px solid var(--color-border);background:var(--color-surface);font-size:0.8rem;font-weight:600;color:var(--color-text-muted);cursor:pointer;transition:all 0.15s;font-family:var(--font-body); }
    .filter-chip:hover  { border-color:var(--color-primary-mid);color:var(--color-primary-mid); }
    .filter-chip.active { background:var(--color-primary-mid);border-color:var(--color-primary-mid);color:#fff; }
    .badge-pay { display:inline-block;padding:0.2rem 0.6rem;border-radius:999px;font-size:0.7rem;font-weight:700; }
    .badge-pay-menunggu   { background:#fef9c3;color:#854d0e; }
    .badge-pay-konfirmasi { background:#dcfce7;color:#166534; }
    .badge-pay-ditolak    { background:#fee2e2;color:#991b1b; }
    .badge-pay-belum      { background:#f1f5f9;color:#64748b; }
    .doc-preview-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.75rem; }
    .doc-thumb { border-radius:var(--radius-md);overflow:hidden;border:1.5px solid var(--color-border);background:var(--color-bg);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none; }
    .doc-thumb img { width:100%;height:100%;object-fit:cover; }
    .doc-thumb-label { font-size:0.65rem;font-weight:700;text-align:center;padding:0.25rem 0.4rem;background:var(--color-bg);color:var(--color-text-muted); }
  </style>
</head>
<body class="ec-loading">

  <div class="page-wrapper">
    <header class="page-topbar">
      <div style="padding-left:3rem;">
        <h2 style="font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Manajemen Pemesanan</h2>
        <p id="subCount" style="font-size:0.75rem;color:var(--color-text-muted);margin:0;">—</p>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <input type="text" id="searchInput" oninput="filterBookings()" placeholder="Cari nama / kode..." class="ec-input" style="width:200px;" />
      </div>
    </header>

    <main class="page-content fade-in">

      <!-- Filter tabs -->
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.25rem;">
        <button class="filter-chip active" data-s="all"                   onclick="setFilter(this,'all')">Semua</button>
        <button class="filter-chip"        data-s="Menunggu"              onclick="setFilter(this,'Menunggu')">Menunggu</button>
        <button class="filter-chip"        data-s="Menunggu Konfirmasi"   onclick="setFilter(this,'Menunggu Konfirmasi')">Menunggu Konfirmasi</button>
        <button class="filter-chip"        data-s="Dikonfirmasi"          onclick="setFilter(this,'Dikonfirmasi')">Dikonfirmasi</button>
        <button class="filter-chip"        data-s="Aktif"                 onclick="setFilter(this,'Aktif')">Aktif</button>
        <button class="filter-chip"        data-s="Selesai"               onclick="setFilter(this,'Selesai')">Selesai</button>
        <button class="filter-chip"        data-s="Dibatalkan"            onclick="setFilter(this,'Dibatalkan')">Dibatalkan</button>
        <button class="filter-chip"        data-s="Pembayaran Ditolak"    onclick="setFilter(this,'Pembayaran Ditolak')">Ditolak</button>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Kode</th>
                <th>Pemesan</th>
                <th>Kendaraan</th>
                <th>Tanggal</th>
                <th>Total</th>
                <th>Status Booking</th>
                <th>Status Bayar</th>
                <th>Bukti</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="bookingTable">
              <tr><td colspan="9" style="text-align:center;padding:3rem;color:var(--color-text-muted);">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- ─── MODAL DETAIL & AKSI ─── -->
  <div id="editOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:#fff;z-index:1;">
        <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Detail & Aksi Booking</h3>
        <button onclick="closeEdit()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);">✕</button>
      </div>
      <div id="editContent" style="padding:1.5rem;"></div>
    </div>
  </div>

  <!-- ─── MODAL BUKTI BAYAR ─── -->
  <div id="buktiOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:210;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:20px;max-width:560px;width:100%;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--color-border);">
        <h4 style="font-family:var(--font-body);font-weight:700;color:var(--color-primary);margin:0;">Bukti Pembayaran</h4>
        <button onclick="closeBukti()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);">✕</button>
      </div>
      <div style="padding:1.25rem;">
        <div id="buktiContent" style="text-align:center;"></div>
      </div>
    </div>
  </div>

  <!-- ─── MODAL DOKUMEN ─── -->
  <div id="docsOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:210;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:#fff;">
        <h4 style="font-family:var(--font-body);font-weight:700;color:var(--color-primary);margin:0;">Dokumen Penyewa</h4>
        <button onclick="closeDocs()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);">✕</button>
      </div>
      <div id="docsContent" style="padding:1.25rem;"></div>
    </div>
  </div>

  <!-- ─── MODAL TOLAK ─── -->
  <div id="tolakOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:220;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:20px;max-width:420px;width:100%;padding:1.5rem;">
      <h4 style="font-family:var(--font-body);font-weight:700;color:var(--color-primary);margin:0 0 1rem;">❌ Tolak Pembayaran</h4>
      <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:0.4rem;">Alasan Penolakan *</label>
      <textarea id="alasanTolak" class="ec-input" rows="3" placeholder="Contoh: Bukti bayar tidak jelas / nominal tidak sesuai..."></textarea>
      <div style="display:flex;gap:0.75rem;margin-top:1rem;">
        <button onclick="closeTolak()" class="btn btn-ghost" style="flex:1;justify-content:center;">Batal</button>
        <button id="tolakBtn" onclick="doTolak()" class="btn" style="flex:1;justify-content:center;background:#dc2626;color:#fff;border-color:#dc2626;">Tolak</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/supabase.js"></script>
  <script src="/components/admin-sidebar.js"></script>
  <script src="/utils/ui.js"></script>

  <script>
    let allBookings  = [];
    let activeFilter = "all";
    let searchTerm   = "";
    let currentAdminUser;
    let pendingTolakId = null;

    (async () => {
      currentAdminUser = await requireAdmin();
      if (!currentAdminUser) return;
      initAdminSidebar("bookings", currentAdminUser);
      await loadBookings();
      document.body.classList.add("ec-ready");
    })();

    async function loadBookings() {
      const { data } = await supabase
        .from("bookings")
        .select("*, profiles(full_name, email), cars(nama)")
        .order("created_at", { ascending: false });
      allBookings = data || [];
      renderTable();
    }

    function setFilter(btn, s) {
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = s;
      renderTable();
    }

    function filterBookings() {
      searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
      renderTable();
    }

    function payBadgeClass(sp) {
      if (!sp || sp === 'Belum Bayar')           return 'badge-pay-belum';
      if (sp === 'Menunggu Konfirmasi')           return 'badge-pay-menunggu';
      if (sp === 'Dikonfirmasi')                  return 'badge-pay-konfirmasi';
      if (sp === 'Ditolak' || sp === 'Pembayaran Ditolak') return 'badge-pay-ditolak';
      return 'badge-pay-belum';
    }

    function renderTable() {
      const filtered = allBookings.filter(b => {
        const matchStatus = activeFilter === "all" || b.status === activeFilter;
        const matchSearch = !searchTerm ||
          (b.kode_booking || "").toLowerCase().includes(searchTerm) ||
          (b.nama_pemesan || "").toLowerCase().includes(searchTerm) ||
          (b.profiles?.full_name || "").toLowerCase().includes(searchTerm);
        return matchStatus && matchSearch;
      });

      document.getElementById("subCount").textContent = filtered.length + " pesanan";
      const tbody = document.getElementById("bookingTable");

      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:3rem;color:var(--color-text-muted);">Tidak ada data</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(b => {
        const kode = b.kode_booking || ("EC" + b.id.slice(-6).toUpperCase());
        const nama = b.profiles?.full_name || b.nama_pemesan || "—";
        const sp   = b.status_pembayaran || 'Belum Bayar';
        const hasBukti = !!b.bukti_bayar_url;

        return `
          <tr>
            <td style="font-weight:600;font-size:0.8rem;font-family:monospace;color:var(--color-primary);">${kode}</td>
            <td style="font-size:0.8125rem;">${nama}</td>
            <td style="font-size:0.8125rem;">${b.cars?.nama || "—"}</td>
            <td style="font-size:0.8rem;color:var(--color-text-muted);">${formatTanggalShort(b.tanggal_mulai)} — ${formatTanggalShort(b.tanggal_selesai)}</td>
            <td style="font-weight:600;font-size:0.8125rem;">${formatRupiah(b.total_harga || 0)}</td>
            <td><span class="badge ${statusBadgeClass(b.status)}">${b.status}</span></td>
            <td><span class="badge-pay ${payBadgeClass(sp)}">${sp}</span></td>
            <td>
              ${hasBukti
                ? `<button onclick="openBukti('${b.bukti_bayar_url}')" class="btn btn-ghost btn-sm"><i class='bx bx-image'></i> Lihat</button>`
                : `<span style="font-size:0.75rem;color:var(--color-text-subtle);">—</span>`
              }
            </td>
            <td style="white-space:nowrap;">
              <button onclick="openEdit('${b.id}')" class="btn btn-ghost btn-sm"><i class='bx bx-edit'></i> Detail</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    // ─── MODAL DETAIL ───
    function openEdit(id) {
      const b    = allBookings.find(x => x.id === id);
      if (!b) return;
      const kode = b.kode_booking || ("EC" + b.id.slice(-6).toUpperCase());
      const nama = b.profiles?.full_name || b.nama_pemesan || "—";
      const sp   = b.status_pembayaran || 'Belum Bayar';
      const isMenunggu = sp === 'Menunggu Konfirmasi';

      const statuses = ["Menunggu","Menunggu Konfirmasi","Dikonfirmasi","Aktif","Selesai","Dibatalkan","Pembayaran Ditolak"];
      const opts = statuses.map(s => `<option value="${s}" ${b.status===s?"selected":""}>${s}</option>`).join("");

      document.getElementById("editContent").innerHTML = `
        <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.25rem;">
          ${detailRow("Kode", `<code>${kode}</code>`)}
          ${detailRow("Pemesan", nama)}
          ${detailRow("No. HP", b.no_hp || "—")}
          ${detailRow("Email", b.email_pemesan || b.profiles?.email || "—")}
          ${detailRow("Kendaraan", b.cars?.nama || "—")}
          ${detailRow("Tanggal", `${formatTanggalShort(b.tanggal_mulai)} — ${formatTanggalShort(b.tanggal_selesai)}`)}
          ${detailRow("Durasi", (b.durasi_hari || "—") + " hari")}
          ${detailRow("Total Sewa", `<strong style="color:var(--color-accent);">${formatRupiah(b.total_harga||0)}</strong>`)}
          ${b.dp_amount != null ? detailRow("DP (30%)", formatRupiah(b.dp_amount)) : ""}
          ${b.deposit_amount != null ? detailRow("Deposit", formatRupiah(b.deposit_amount)) : ""}
          ${b.sudah_dibayar != null ? detailRow("Sudah Dibayar", `<strong>${formatRupiah(b.sudah_dibayar)}</strong>`) : ""}
          ${b.sisa_pelunasan != null ? detailRow("Sisa Pelunasan", formatRupiah(b.sisa_pelunasan)) : ""}
          ${detailRow("Jaminan", b.jenis_jaminan || "—")}
          ${b.jenis_jaminan==='kendaraan' && b.jaminan_kendaraan_merek ? detailRow("Kendaraan Jaminan", `${b.jaminan_kendaraan_merek} (${b.jaminan_kendaraan_tahun}) — ${b.jaminan_kendaraan_plat}`) : ""}
          ${detailRow("Status Bayar", `<span class="badge-pay ${payBadgeClass(sp)}">${sp}</span>`)}
          ${b.alasan_penolakan ? detailRow("Alasan Tolak", `<span style="color:#dc2626;">${b.alasan_penolakan}</span>`) : ""}
          ${b.tujuan_sewa ? detailRow("Tujuan Sewa", b.tujuan_sewa) : ""}
        </div>

        <!-- Aksi bayar -->
        ${isMenunggu ? `
        <div style="display:flex;gap:0.75rem;margin-bottom:1.25rem;">
          <button onclick="konfirmasiPembayaran('${id}')" class="btn btn-sm" style="flex:1;justify-content:center;background:#16a34a;color:#fff;border-color:#16a34a;">
            ✅ Konfirmasi Pembayaran
          </button>
          <button onclick="openTolak('${id}')" class="btn btn-sm" style="flex:1;justify-content:center;background:#dc2626;color:#fff;border-color:#dc2626;">
            ❌ Tolak
          </button>
        </div>` : ""}

        <!-- Lihat dokumen -->
        <div style="display:flex;gap:0.75rem;margin-bottom:1.25rem;">
          <button onclick="openDocs('${id}')" class="btn btn-ghost btn-sm">
            <i class='bx bx-file'></i> Lihat Dokumen
          </button>
          ${b.bukti_bayar_url ? `<button onclick="openBukti('${b.bukti_bayar_url}')" class="btn btn-ghost btn-sm"><i class='bx bx-image'></i> Bukti Bayar</button>` : ""}
        </div>

        <!-- Update status manual -->
        <div>
          <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:0.4rem;">Update Status Booking</label>
          <select id="newStatus" class="ec-input" style="margin-bottom:0.75rem;">${opts}</select>
          <button onclick="updateStatus('${id}')" class="btn btn-primary btn-sm" style="width:100%;justify-content:center;">
            <i class='bx bx-save'></i> Simpan Status
          </button>
        </div>
      `;
      document.getElementById("editOverlay").style.display = "flex";
    }

    function detailRow(label, val) {
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;padding:0.4rem 0;border-bottom:1px solid var(--color-border);">
        <span style="font-size:0.8125rem;color:var(--color-text-muted);flex-shrink:0;">${label}</span>
        <span style="font-size:0.8125rem;font-weight:600;color:var(--color-text);text-align:right;">${val}</span>
      </div>`;
    }

    function closeEdit() { document.getElementById("editOverlay").style.display = "none"; }
    document.getElementById("editOverlay").addEventListener("click", e => { if (e.target===e.currentTarget) closeEdit(); });

    // ─── KONFIRMASI PEMBAYARAN ───
    async function konfirmasiPembayaran(id) {
      showLoading("Mengkonfirmasi...");
      const { error } = await supabase.from("bookings").update({
        status:           "Dikonfirmasi",
        status_pembayaran:"Dikonfirmasi",
        confirmed_at:     new Date().toISOString(),
        confirmed_by:     currentAdminUser.id,
      }).eq("id", id);
      hideLoading();
      if (error) { showToast("Gagal: " + error.message, "error"); return; }
      showToast("✅ Pembayaran dikonfirmasi!", "success");
      closeEdit();
      await loadBookings();
    }

    // ─── TOLAK PEMBAYARAN ───
    function openTolak(id) {
      pendingTolakId = id;
      document.getElementById("alasanTolak").value = "";
      document.getElementById("tolakOverlay").style.display = "flex";
    }
    function closeTolak() { document.getElementById("tolakOverlay").style.display = "none"; pendingTolakId = null; }

    async function doTolak() {
      const alasan = document.getElementById("alasanTolak").value.trim();
      if (!alasan) { showToast("Isi alasan penolakan.", "warning"); return; }
      showLoading("Menolak...");
      const { error } = await supabase.from("bookings").update({
        status:            "Pembayaran Ditolak",
        status_pembayaran: "Ditolak",
        alasan_penolakan:  alasan,
      }).eq("id", pendingTolakId);
      hideLoading();
      if (error) { showToast("Gagal: " + error.message, "error"); return; }
      showToast("Pembayaran ditolak.", "success");
      closeTolak();
      closeEdit();
      await loadBookings();
    }

    // ─── UPDATE STATUS MANUAL ───
    async function updateStatus(id) {
      const newStatus = document.getElementById("newStatus").value;
      showLoading("Menyimpan...");
      const { error } = await supabase.from("bookings").update({ status: newStatus }).eq("id", id);
      hideLoading();
      if (error) { showToast("Gagal: " + error.message, "error"); return; }
      showToast("Status diperbarui!", "success");
      closeEdit();
      await loadBookings();
    }

    // ─── BUKTI BAYAR ───
    function openBukti(url) {
      const isPdf = url.toLowerCase().endsWith('.pdf');
      document.getElementById("buktiContent").innerHTML = isPdf
        ? `<a href="${url}" target="_blank" class="btn btn-primary" style="margin:1rem auto;display:inline-flex;"><i class='bx bx-file-pdf'></i> Buka PDF Bukti Bayar</a>`
        : `<img src="${url}" alt="Bukti bayar" style="max-width:100%;border-radius:var(--radius-md);" onerror="this.src='';this.alt='Gagal memuat gambar'" />
           <p style="margin-top:0.75rem;"><a href="${url}" target="_blank" class="btn btn-ghost btn-sm"><i class='bx bx-link-external'></i> Buka di tab baru</a></p>`;
      document.getElementById("buktiOverlay").style.display = "flex";
    }
    function closeBukti() { document.getElementById("buktiOverlay").style.display = "none"; }
    document.getElementById("buktiOverlay").addEventListener("click", e => { if (e.target===e.currentTarget) closeBukti(); });

    // ─── DOKUMEN ───
    async function openDocs(bookingId) {
      document.getElementById("docsContent").innerHTML = `<div style="text-align:center;padding:2rem;color:var(--color-text-muted);">Memuat dokumen...</div>`;
      document.getElementById("docsOverlay").style.display = "flex";

      const { data: docs, error } = await supabase
        .from("booking_documents")
        .select("*")
        .eq("booking_id", bookingId)
        .order("uploaded_at");

      if (error || !docs?.length) {
        document.getElementById("docsContent").innerHTML = `<p style="text-align:center;color:var(--color-text-muted);padding:2rem;">Tidak ada dokumen yang diupload.</p>`;
        return;
      }

      document.getElementById("docsContent").innerHTML = `
        <div class="doc-preview-grid">
          ${docs.map(doc => {
            const isImg = doc.file_url && /\.(jpg|jpeg|png|webp|gif)$/i.test(doc.file_url);
            const isPdf = doc.file_url && /\.pdf$/i.test(doc.file_url);
            return `
              <div>
                <a href="${doc.file_url}" target="_blank" class="doc-thumb">
                  ${isImg ? `<img src="${doc.file_url}" alt="${doc.tipe_doc}" />` : `<i class='bx bx-file' style="font-size:2rem;color:var(--color-text-subtle);"></i>`}
                </a>
                <p class="doc-thumb-label">${doc.tipe_doc}</p>
              </div>
            `;
          }).join("")}
        </div>
        <p style="font-size:0.75rem;color:var(--color-text-muted);margin-top:1rem;">Klik dokumen untuk membuka di tab baru.</p>
      `;
    }
    function closeDocs() { document.getElementById("docsOverlay").style.display = "none"; }
    document.getElementById("docsOverlay").addEventListener("click", e => { if (e.target===e.currentTarget) closeDocs(); });
  </script>
</body>
</html>
