<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Armada Kendaraan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    .car-card {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
    }
    .car-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    .filter-chip {
      padding: 0.4rem 1rem;
      border-radius: 999px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-body);
    }
    .filter-chip:hover  { border-color: var(--color-primary-mid); color: var(--color-primary-mid); }
    .filter-chip.active { background: var(--color-primary-mid); border-color: var(--color-primary-mid); color: #fff; }

    /* Detail modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
  </style>
</head>
<body>

  <!-- Public Navbar injected here -->

  <!-- Page header -->
  <div style="background:linear-gradient(135deg,#0f2347 0%,#1a3c6e 100%);padding:3rem 2rem 2rem;">
    <div style="max-width:1200px;margin:0 auto;">
      <h1 style="color:#fff;font-size:1.75rem;font-weight:800;margin:0 0 0.35rem;">Armada Kendaraan</h1>
      <p style="color:rgba(255,255,255,0.55);margin:0;font-size:0.9rem;">Pilih kendaraan terbaik untuk perjalanan Anda</p>
    </div>
  </div>

  <div style="max-width:1200px;margin:0 auto;padding:2rem;">

    <!-- Filter & Search Bar -->
    <div class="card" style="padding:1.25rem;margin-bottom:1.5rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;">
      <!-- Search -->
      <div style="position:relative;flex:1;min-width:200px;">
        <i class='bx bx-search' style="position:absolute;left:0.875rem;top:50%;transform:translateY(-50%);color:var(--color-text-subtle);font-size:1rem;"></i>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Cari nama kendaraan..."
          class="ec-input" style="padding-left:2.5rem;" />
      </div>
      <!-- Sort -->
      <select id="sortSel" onchange="applyFilters()" class="ec-input" style="width:auto;">
        <option value="default">Urutan Default</option>
        <option value="price_asc">Harga: Termurah</option>
        <option value="price_desc">Harga: Termahal</option>
        <option value="name_asc">Nama: A–Z</option>
      </select>
      <!-- Price range -->
      <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
        <input type="number" id="priceMin" oninput="applyFilters()" placeholder="Min harga" class="ec-input" style="width:120px;" />
        <span style="color:var(--color-text-muted);font-size:0.875rem;">—</span>
        <input type="number" id="priceMax" oninput="applyFilters()" placeholder="Max harga" class="ec-input" style="width:120px;" />
      </div>
    </div>

    <!-- Type chips -->
    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem;">
      <button class="filter-chip active" data-filter="all"     onclick="setTypeFilter(this,'all')">Semua</button>
      <button class="filter-chip"        data-filter="MPV"     onclick="setTypeFilter(this,'MPV')">MPV</button>
      <button class="filter-chip"        data-filter="SUV"     onclick="setTypeFilter(this,'SUV')">SUV</button>
      <button class="filter-chip"        data-filter="Sedan"   onclick="setTypeFilter(this,'Sedan')">Sedan</button>
      <button class="filter-chip"        data-filter="Pickup"  onclick="setTypeFilter(this,'Pickup')">Pickup</button>
      <button class="filter-chip"        data-filter="Minibus" onclick="setTypeFilter(this,'Minibus')">Minibus</button>
      <button class="filter-chip"        data-filter="Matic"   onclick="setTypeFilter(this,'Matic')">Matic</button>
      <button class="filter-chip"        data-filter="Manual"  onclick="setTypeFilter(this,'Manual')">Manual</button>
    </div>

    <!-- Result count -->
    <p id="resultCount" style="font-size:0.8125rem;color:var(--color-text-muted);margin-bottom:1rem;font-weight:500;"></p>

    <!-- Grid -->
    <div id="carGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;">
      ${Array(8).fill(`
        <div class="car-card">
          <div class="skeleton" style="height:185px;border-radius:0;"></div>
          <div style="padding:1.25rem;">
            <div class="skeleton" style="height:16px;width:65%;margin-bottom:0.625rem;"></div>
            <div class="skeleton" style="height:13px;width:45%;margin-bottom:1rem;"></div>
            <div class="skeleton" style="height:36px;border-radius:10px;"></div>
          </div>
        </div>
      `).join("")}
    </div>

    <div id="carEmpty" style="display:none;text-align:center;padding:4rem 1rem;">
      <i class='bx bx-car' style="font-size:3rem;color:var(--color-text-subtle);"></i>
      <p style="color:var(--color-text-muted);margin-top:0.75rem;font-weight:500;">Tidak ada kendaraan yang cocok</p>
      <button onclick="resetFilters()" class="btn btn-ghost" style="margin-top:1rem;">Reset Filter</button>
    </div>
  </div>

  <!-- Footer -->
  <footer style="background:var(--color-primary);color:rgba(255,255,255,0.45);text-align:center;padding:1.5rem;font-size:0.8125rem;margin-top:2rem;">
    &copy; 2026 EasyCar — Rental Kendaraan Terpercaya
  </footer>

  <!-- Car Detail Modal -->
  <div id="detailModal" class="modal-overlay" onclick="handleModalClick(event)">
    <div id="detailBox" style="background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;">
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/supabase.js"></script>
  <script src="/components/public-navbar.js"></script>

  <script>
    let allCars     = [];
    let typeFilter  = "all";

    (async () => {
      await initPublicNavbar();
      await loadCars();
    })();

    async function loadCars() {
      const { data, error } = await supabase
        .from("cars")
        .select("*")
        .eq("status", "Tersedia")
        .order("created_at", { ascending: false });

      if (error || !data) {
        document.getElementById("carGrid").innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--color-text-muted);">
            <i class='bx bxs-error-circle' style="font-size:2.5rem;display:block;margin-bottom:0.5rem;"></i>
            Gagal memuat kendaraan. Coba muat ulang halaman.
          </div>`;
        return;
      }

      allCars = data;
      applyFilters();
    }

    function setTypeFilter(btn, filter) {
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      typeFilter = filter;
      applyFilters();
    }

    function applyFilters() {
      const q        = document.getElementById("searchInput").value.toLowerCase().trim();
      const sort     = document.getElementById("sortSel").value;
      const priceMin = parseFloat(document.getElementById("priceMin").value) || 0;
      const priceMax = parseFloat(document.getElementById("priceMax").value) || Infinity;

      let filtered = allCars.filter(c => {
        const matchType = typeFilter === "all" || c.tipe === typeFilter || c.transmisi === typeFilter;
        const matchQ    = !q || c.nama.toLowerCase().includes(q) || (c.tipe || "").toLowerCase().includes(q);
        const matchPrice = (c.harga_per_hari || 0) >= priceMin && (c.harga_per_hari || 0) <= priceMax;
        return matchType && matchQ && matchPrice;
      });

      if (sort === "price_asc")  filtered.sort((a,b) => (a.harga_per_hari||0) - (b.harga_per_hari||0));
      if (sort === "price_desc") filtered.sort((a,b) => (b.harga_per_hari||0) - (a.harga_per_hari||0));
      if (sort === "name_asc")   filtered.sort((a,b) => a.nama.localeCompare(b.nama));

      renderGrid(filtered);
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("sortSel").value     = "default";
      document.getElementById("priceMin").value    = "";
      document.getElementById("priceMax").value    = "";
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      document.querySelector(".filter-chip[data-filter='all']").classList.add("active");
      typeFilter = "all";
      applyFilters();
    }

    function renderGrid(cars) {
      const grid  = document.getElementById("carGrid");
      const empty = document.getElementById("carEmpty");
      const count = document.getElementById("resultCount");

      count.textContent = `Menampilkan ${cars.length} kendaraan`;

      if (!cars.length) {
        grid.innerHTML  = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      grid.innerHTML = cars.map(c => {
        const imgBlock = c.foto_url
          ? `<img src="${c.foto_url}" alt="${c.nama}"
               style="width:100%;height:185px;object-fit:cover;"
               loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
             <div style="display:none;height:185px;background:var(--color-bg);align-items:center;justify-content:center;">
               <i class='bx bxs-car' style="font-size:3rem;color:var(--color-text-subtle);"></i>
             </div>`
          : `<div style="height:185px;background:var(--color-bg);display:flex;align-items:center;justify-content:center;">
               <i class='bx bxs-car' style="font-size:3rem;color:var(--color-text-subtle);"></i>
             </div>`;

        const chips = [c.tipe, c.transmisi, c.kapasitas ? `${c.kapasitas} kursi` : null]
          .filter(Boolean)
          .map(x => `<span style="font-size:0.7rem;background:#f0f4f8;color:#64748b;padding:0.15rem 0.55rem;border-radius:6px;font-weight:600;">${x}</span>`)
          .join("");

        return `
          <div class="car-card" style="cursor:pointer;" onclick="openDetail('${c.id}')">
            <div style="position:relative;">
              ${imgBlock}
              <span class="badge badge-success" style="position:absolute;top:10px;left:10px;">Tersedia</span>
            </div>
            <div style="padding:1.25rem;flex:1;display:flex;flex-direction:column;">
              <div style="flex:1;">
                <h3 style="font-weight:700;color:var(--color-primary);font-size:0.9375rem;margin:0 0 0.35rem;">${c.nama}</h3>
                <div style="display:flex;flex-wrap:wrap;gap:0.35rem;margin-bottom:0.875rem;">${chips}</div>
                <p style="font-size:1rem;font-weight:700;color:var(--color-accent);margin:0;">
                  ${formatRupiah(c.harga_per_hari||0)}
                  <span style="font-size:0.75rem;font-weight:500;color:var(--color-text-muted);">/hari</span>
                </p>
              </div>
              <div style="display:flex;gap:0.625rem;margin-top:1rem;">
                <button onclick="event.stopPropagation();openDetail('${c.id}')" class="btn btn-ghost btn-sm" style="flex:1;justify-content:center;">
                  <i class='bx bx-info-circle'></i> Detail
                </button>
                <button onclick="event.stopPropagation();handleBook('${c.id}')" class="btn btn-primary btn-sm" style="flex:1;justify-content:center;">
                  <i class='bx bxs-calendar-plus'></i> Pesan
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function openDetail(carId) {
      const c = allCars.find(x => x.id === carId);
      if (!c) return;

      const imgBlock = c.foto_url
        ? `<img src="${c.foto_url}" alt="${c.nama}" style="width:100%;height:220px;object-fit:cover;" />`
        : `<div style="height:220px;background:var(--color-bg);display:flex;align-items:center;justify-content:center;">
             <i class='bx bxs-car' style="font-size:4rem;color:var(--color-text-subtle);"></i>
           </div>`;

      const specs = [
        ["Tipe",        c.tipe || "—"],
        ["Transmisi",   c.transmisi || "—"],
        ["Kapasitas",   c.kapasitas ? `${c.kapasitas} orang` : "—"],
        ["Tahun",       c.tahun || "—"],
        ["Nomor Plat",  c.nomor_plat || "—"],
      ];

      document.getElementById("detailContent").innerHTML = `
        <div>
          ${imgBlock}
          <div style="padding:1.5rem;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem;">
              <div>
                <h2 style="font-size:1.25rem;font-weight:800;color:var(--color-primary);margin:0 0 0.25rem;">${c.nama}</h2>
                <span class="badge badge-success">Tersedia</span>
              </div>
              <button onclick="closeDetail()"
                style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);flex-shrink:0;">✕</button>
            </div>

            ${c.deskripsi ? `<p style="font-size:0.875rem;color:var(--color-text-muted);line-height:1.7;margin:0 0 1.25rem;">${c.deskripsi}</p>` : ""}

            <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:1rem;margin-bottom:1.25rem;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.625rem;">
                ${specs.map(([k,v]) => `
                  <div>
                    <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;text-transform:uppercase;letter-spacing:0.04em;">${k}</p>
                    <p style="font-size:0.875rem;font-weight:600;color:var(--color-text);margin:0;">${v}</p>
                  </div>
                `).join("")}
              </div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 0;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);margin-bottom:1.25rem;">
              <span style="font-size:0.875rem;color:var(--color-text-muted);">Harga Sewa</span>
              <span style="font-size:1.5rem;font-weight:800;color:var(--color-accent);">
                ${formatRupiah(c.harga_per_hari||0)}
                <span style="font-size:0.875rem;font-weight:500;color:var(--color-text-muted);">/hari</span>
              </span>
            </div>

            <button onclick="handleBook('${c.id}')" class="btn btn-accent" style="width:100%;justify-content:center;padding:0.875rem;">
              <i class='bx bxs-calendar-plus'></i> Pesan Sekarang
            </button>
          </div>
        </div>
      `;

      document.getElementById("detailModal").style.display = "flex";
    }

    function closeDetail() {
      document.getElementById("detailModal").style.display = "none";
    }

    function handleModalClick(e) {
      if (e.target === document.getElementById("detailModal")) closeDetail();
    }

    async function handleBook(carId) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        const returnUrl = encodeURIComponent(`/pages/user/booking.html?car_id=${carId}`);
        window.location.href = `/index.html?tab=login&redirect=${returnUrl}`;
        return;
      }
      window.location.href = `/pages/user/booking.html?car_id=${carId}`;
    }
  </script>
</body>
</html>
