<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Pesanan Saya</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    body.ec-loading { visibility: hidden; }
    .order-card { transition: box-shadow 0.2s; }
    .order-card:hover { box-shadow: var(--shadow-md); }
    .filter-chip { padding:0.4rem 1rem;border-radius:999px;border:1.5px solid var(--color-border);background:var(--color-surface);font-size:0.8125rem;font-weight:600;color:var(--color-text-muted);cursor:pointer;transition:all 0.15s;font-family:var(--font-body); }
    .filter-chip:hover { border-color:var(--color-primary-mid);color:var(--color-primary-mid); }
    .filter-chip.active { background:var(--color-primary-mid);border-color:var(--color-primary-mid);color:#fff; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulseIn { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }
    .order-card { animation: pulseIn 0.3s ease; }

    /* Alasan tolak banner */
    .tolak-banner {
      background: #fef2f2; border: 1.5px solid #fca5a5; border-radius: 10px;
      padding: 0.75rem 1rem; margin-top: 0.625rem;
      display: flex; gap: 0.5rem; align-items: flex-start;
    }
    .tolak-banner i { color: #dc2626; font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
    .tolak-banner .tolak-title { font-size: 0.75rem; font-weight: 700; color: #dc2626; }
    .tolak-banner .tolak-alasan { font-size: 0.8125rem; color: #7f1d1d; margin-top: 1px; }

    /* Payment breakdown */
    .pay-breakdown { background: var(--color-bg); border-radius: 10px; padding: 0.875rem; }
    .pay-row { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; }
    .pay-row + .pay-row { border-top: 1px solid var(--color-border); }
    .pay-row.pay-total { border-top: 2px solid var(--color-primary); margin-top: 0.25rem; padding-top: 0.625rem; }
  </style>
</head>
<body class="ec-loading">

  <div class="page-wrapper">
    <header class="page-topbar">
      <div style="padding-left:3rem;">
        <h2 style="font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Pesanan Saya</h2>
        <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;">Riwayat dan status pesanan Anda</p>
      </div>
      <a href="/pages/user/booking.html" class="btn btn-accent btn-sm">
        <i class='bx bx-plus'></i> Booking Baru
      </a>
    </header>

    <main class="page-content fade-in">
      <!-- Realtime indicator -->
      <div id="realtimeIndicator" style="display:none;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:0.5rem 0.875rem;margin-bottom:1rem;font-size:0.78rem;color:#15803d;font-weight:500;display:flex;align-items:center;gap:0.5rem;">
        <span style="width:7px;height:7px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0;"></span>
        Terhubung realtime — status update otomatis
      </div>
      <style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}</style>

      <!-- Filter tabs -->
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem;">
        <button class="filter-chip active" onclick="setFilter(this,'all')">Semua</button>
        <button class="filter-chip" onclick="setFilter(this,'Menunggu Konfirmasi')">Menunggu Konfirmasi</button>
        <button class="filter-chip" onclick="setFilter(this,'Dikonfirmasi')">Dikonfirmasi</button>
        <button class="filter-chip" onclick="setFilter(this,'Aktif')">Aktif</button>
        <button class="filter-chip" onclick="setFilter(this,'Selesai')">Selesai</button>
        <button class="filter-chip" onclick="setFilter(this,'Ditolak')">Ditolak</button>
        <button class="filter-chip" onclick="setFilter(this,'Dibatalkan')">Dibatalkan</button>
      </div>

      <!-- Orders list -->
      <div id="ordersList">
        <div style="text-align:center;padding:3rem;color:var(--color-text-muted);">
          <i class='bx bx-loader-alt' style="font-size:2.5rem;animation:spin 1s linear infinite;display:block;"></i>
          <p style="margin-top:0.5rem;">Memuat pesanan...</p>
        </div>
      </div>
    </main>
    <footer style="text-align:center;color:var(--color-text-subtle);font-size:0.75rem;padding:1.25rem;">&copy; 2026 EasyCar</footer>
  </div>

  <!-- Detail Modal -->
  <div id="detailOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:1.125rem 1.5rem;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:#fff;z-index:1;border-radius:24px 24px 0 0;">
        <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Detail Pesanan</h3>
        <button onclick="closeDetail()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);">✕</button>
      </div>
      <div id="detailContent" style="padding:1.5rem;"></div>
      <div style="padding:0 1.5rem 1.5rem;display:flex;flex-direction:column;gap:0.625rem;" id="detailActions"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/supabase.js"></script>
  <script src="/services/realtime.js"></script>
  <script src="/services/print.js"></script>
  <script src="/components/user-sidebar.js"></script>
  <script src="/utils/ui.js"></script>

  <script>
    let allOrders    = [];
    let activeFilter = "all";
    let openBookingId = null;
    let currentUser   = null;

    (async () => {
      currentUser = await requireLogin();
      if (!currentUser) return;

      initUserSidebar("my-orders", currentUser);
      await loadOrders();
      document.body.classList.add("ec-ready");

      // ── REALTIME ────────────────────────────────────
      EasyCarRealtime.subscribeUserBookings(currentUser.id, {
        onInsert: async () => { await loadOrders(); },
        onUpdate: async (payload) => {
          // Update data lokal tanpa full reload
          const updated = payload.new;
          const idx = allOrders.findIndex(o => o.id === updated.id);
          if (idx !== -1) {
            allOrders[idx] = { ...allOrders[idx], ...updated };
            renderOrders();
            // Jika detail modal sedang buka untuk booking ini, refresh
            if (openBookingId === updated.id) openDetail(updated.id);
          } else {
            await loadOrders(); // fallback
          }
        },
      });

      // Show realtime indicator
      document.getElementById("realtimeIndicator").style.display = "flex";
    })();

    async function loadOrders() {
      const { data } = await supabase
        .from("bookings")
        .select("*, cars(id, nama, foto_url, tipe, transmisi, harga_per_hari)")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });
      allOrders = data || [];
      renderOrders();
    }

    function setFilter(btn, status) {
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = status;
      renderOrders();
    }

    function renderOrders() {
      const list = document.getElementById("ordersList");
      const filtered = activeFilter === "all" ? allOrders : allOrders.filter(o => o.status === activeFilter);
      if (!filtered.length) {
        list.innerHTML = `
          <div style="text-align:center;padding:4rem 1rem;">
            <i class='bx bxs-receipt' style="font-size:3rem;color:var(--color-text-subtle);"></i>
            <p style="color:var(--color-text-muted);margin-top:0.75rem;font-weight:500;">Belum ada pesanan ${activeFilter === "all" ? "" : "dengan status <strong>" + activeFilter + "</strong>"}</p>
            <a href="/pages/user/booking.html" class="btn btn-accent" style="display:inline-flex;margin-top:1rem;">
              <i class='bx bx-plus'></i> Buat Pesanan
            </a>
          </div>`;
        return;
      }
      list.innerHTML = `<div style="display:flex;flex-direction:column;gap:1rem;">${filtered.map(orderCardHTML).join("")}</div>`;
    }

    function orderCardHTML(o) {
      const car  = o.cars || {};
      const img  = car.foto_url
        ? `<img src="${car.foto_url}" style="width:80px;height:60px;object-fit:cover;border-radius:var(--radius-md);flex-shrink:0;" />`
        : `<div style="width:80px;height:60px;background:var(--color-bg);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class='bx bxs-car' style="font-size:1.5rem;color:var(--color-text-subtle);"></i></div>`;
      const kode = o.kode_booking || ("EC" + o.id.slice(-6).toUpperCase());
      const dp      = o.dp_amount || 0;
      const deposit = o.deposit_amount || 0;
      const bayarNow = dp + deposit;

      let extraBanner = "";
      if (o.status === "Ditolak" && o.alasan_tolak) {
        extraBanner = `<div class="tolak-banner"><i class='bx bxs-error-circle'></i><div><div class="tolak-title">Alasan Penolakan</div><div class="tolak-alasan">${o.alasan_tolak}</div></div></div>`;
      }

      return `
        <div class="card order-card" style="padding:1.25rem;cursor:pointer;" onclick="openDetail('${o.id}')">
          <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
            ${img}
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;">
                <div>
                  <p style="font-weight:700;color:var(--color-primary);font-size:0.9375rem;margin:0 0 0.2rem;">${car.nama || "Kendaraan"}</p>
                  <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;font-family:monospace;font-weight:600;">${kode}</p>
                </div>
                <span class="badge ${statusBadgeClass(o.status)}">${o.status}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:1rem;margin-top:0.75rem;">
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Tanggal</p>
                  <p style="font-size:0.8125rem;font-weight:600;color:var(--color-text);margin:0;">${formatTanggalShort(o.tanggal_mulai)} — ${formatTanggalShort(o.tanggal_selesai)}</p>
                </div>
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Durasi</p>
                  <p style="font-size:0.8125rem;font-weight:600;color:var(--color-text);margin:0;">${o.durasi_hari || "—"} hari</p>
                </div>
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Total Bayar Awal</p>
                  <p style="font-size:0.8125rem;font-weight:700;color:var(--color-accent);margin:0;">${formatRupiah(bayarNow)}</p>
                </div>
              </div>
            </div>
          </div>
          ${extraBanner}
        </div>`;
    }

    function openDetail(id) {
      const o = allOrders.find(x => x.id === id);
      if (!o) return;
      openBookingId = id;
      const car  = o.cars || {};
      const kode = o.kode_booking || ("EC" + o.id.slice(-6).toUpperCase());
      const dp      = o.dp_amount || 0;
      const deposit = o.deposit_amount || 0;
      const bayarNow = dp + deposit;
      const sisa     = o.sisa_pelunasan || (o.total_harga - dp);

      document.getElementById("detailContent").innerHTML = `
        <div style="display:flex;flex-direction:column;gap:0.875rem;">
          ${car.foto_url ? `<img src="${car.foto_url}" style="width:100%;height:160px;object-fit:cover;border-radius:var(--radius-md);" />` : ""}
          <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:1rem;">
            <p style="font-weight:700;color:var(--color-primary);margin:0 0 0.15rem;">${car.nama || "—"}</p>
            <p style="font-size:0.8rem;color:var(--color-text-muted);margin:0;">${car.tipe || ""} ${car.transmisi ? "· " + car.transmisi : ""}</p>
          </div>
          ${infoRow("Kode Booking", `<code style="font-family:monospace;font-weight:700;">${kode}</code>`)}
          ${infoRow("Status", `<span class="badge ${statusBadgeClass(o.status)}">${o.status}</span>`)}
          ${infoRow("Tanggal Mulai", formatTanggal(o.tanggal_mulai))}
          ${infoRow("Tanggal Selesai", formatTanggal(o.tanggal_selesai))}
          ${infoRow("Durasi", (o.durasi_hari || "—") + " hari")}
          ${infoRow("Nama Pemesan", o.nama_pemesan || "—")}
          ${infoRow("No. HP", o.no_hp || "—")}
          ${infoRow("Jenis Jaminan", o.jenis_jaminan === "kendaraan" ? "Jaminan Kendaraan" : "Jaminan Non-Kendaraan")}

          ${o.alasan_tolak ? `
            <div class="tolak-banner" style="margin-top:0;">
              <i class='bx bxs-error-circle'></i>
              <div>
                <div class="tolak-title">Alasan Penolakan Admin</div>
                <div class="tolak-alasan">${o.alasan_tolak}</div>
              </div>
            </div>` : ""}

          <!-- Breakdown Pembayaran -->
          <div>
            <p style="font-size:0.75rem;font-weight:700;color:var(--color-primary);margin:0 0 0.625rem;text-transform:uppercase;letter-spacing:0.05em;">Rincian Pembayaran</p>
            <div class="pay-breakdown">
              <div class="pay-row">
                <span style="font-size:0.8125rem;color:var(--color-text-muted);">Harga Sewa (${o.durasi_hari || "?"} hari)</span>
                <span style="font-size:0.8125rem;font-weight:600;">${formatRupiah(o.total_harga || 0)}</span>
              </div>
              <div class="pay-row">
                <span style="font-size:0.8125rem;color:var(--color-text-muted);">DP Booking${dp > 0 ? " (30%)" : ""}</span>
                <span style="font-size:0.8125rem;font-weight:600;color:var(--color-accent);">${dp > 0 ? formatRupiah(dp) : "Tidak ada"}</span>
              </div>
              <div class="pay-row">
                <span style="font-size:0.8125rem;color:var(--color-text-muted);">Deposit Jaminan</span>
                <span style="font-size:0.8125rem;font-weight:600;color:var(--color-accent);">${formatRupiah(deposit)}</span>
              </div>
              <div class="pay-row pay-total">
                <span style="font-size:0.875rem;font-weight:700;color:var(--color-primary);">Total Dibayar Awal</span>
                <span style="font-size:1rem;font-weight:800;color:var(--color-accent);">${formatRupiah(bayarNow)}</span>
              </div>
              ${sisa > 0 ? `<div class="pay-row" style="border-top:none;"><span style="font-size:0.75rem;color:var(--color-text-muted);font-style:italic;">Sisa pelunasan saat pengambilan</span><span style="font-size:0.75rem;font-weight:700;color:#dc2626;">${formatRupiah(sisa)}</span></div>` : ""}
            </div>
          </div>
        </div>`;

      // Action buttons
      const actionsEl = document.getElementById("detailActions");
      let actionsHTML = "";

      // Cetak invoice (semua status)
      actionsHTML += `<button onclick="doPrintA4('${id}')" class="btn btn-sm" style="width:100%;justify-content:center;background:#1e293b;color:#fff;border-color:#1e293b;"><i class='bx bx-printer'></i> Cetak Invoice A4</button>`;

      // WA admin
      const waLink = EasyCarRealtime.buildWALink(o, car);
      actionsHTML += `<a href="${waLink}" target="_blank" class="btn btn-sm" style="width:100%;justify-content:center;background:#16a34a;color:#fff;border-color:#16a34a;"><i class='bx bxl-whatsapp'></i> Hubungi Admin via WhatsApp</a>`;

      // Booking ulang jika ditolak
      if (o.status === "Ditolak" || o.status === "Dibatalkan") {
        const carIdForRebook = car.id || (o.cars && o.cars.id) || "";
        actionsHTML += `<a href="/pages/user/booking.html${carIdForRebook ? '?car_id=' + carIdForRebook : ''}" class="btn btn-accent btn-sm" style="width:100%;justify-content:center;"><i class='bx bx-refresh'></i> Booking Ulang</a>`;
      }

      actionsEl.innerHTML = actionsHTML;
      document.getElementById("detailOverlay").style.display = "flex";
    }

    function doPrintA4(bookingId) {
      const o = allOrders.find(x => x.id === bookingId);
      if (!o) return;
      EasyCarPrint.printInvoiceA4(o, o.cars);
    }

    function infoRow(label, val) {
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;padding:0.3rem 0;border-bottom:1px solid var(--color-border);"><span style="font-size:0.8125rem;color:var(--color-text-muted);">${label}</span><span style="font-size:0.8125rem;font-weight:600;color:var(--color-text);text-align:right;">${val}</span></div>`;
    }

    function closeDetail() {
      document.getElementById("detailOverlay").style.display = "none";
      openBookingId = null;
    }
    document.getElementById("detailOverlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeDetail();
    });
  </script>
</body>
</html>
