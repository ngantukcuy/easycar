<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Pesanan Saya</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    body.ec-loading { visibility: hidden; }
    .order-card { transition: box-shadow 0.2s; }
    .order-card:hover { box-shadow: var(--shadow-md); }
    .filter-chip { padding:0.4rem 1rem;border-radius:999px;border:1.5px solid var(--color-border);background:var(--color-surface);font-size:0.8125rem;font-weight:600;color:var(--color-text-muted);cursor:pointer;transition:all 0.15s;font-family:var(--font-body); }
    .filter-chip:hover { border-color:var(--color-primary-mid);color:var(--color-primary-mid); }
    .filter-chip.active { background:var(--color-primary-mid);border-color:var(--color-primary-mid);color:#fff; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Invoice Print styles */
    @media print {
      body > *:not(#invoicePrint) { display: none !important; }
      #invoicePrint { display: block !important; position: static !important; background: #fff !important; }
      @page { size: 80mm auto; margin: 0.3cm; }
    }
  </style>
</head>
<body class="ec-loading">

  <div class="page-wrapper">
    <header class="page-topbar">
      <div style="padding-left:3rem;">
        <h2 style="font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Pesanan Saya</h2>
        <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;">Riwayat dan status pesanan Anda</p>
      </div>
      <a href="/pages/user/booking.html" class="btn btn-accent btn-sm">
        <i class='bx bx-plus'></i> Booking Baru
      </a>
    </header>

    <main class="page-content fade-in">

      <!-- Filter tabs -->
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem;">
        <button class="filter-chip active" data-status="all"                  onclick="setFilter(this,'all')">Semua</button>
        <button class="filter-chip"        data-status="Menunggu"             onclick="setFilter(this,'Menunggu')">Menunggu</button>
        <button class="filter-chip"        data-status="Menunggu Konfirmasi"  onclick="setFilter(this,'Menunggu Konfirmasi')">Menunggu Konfirmasi</button>
        <button class="filter-chip"        data-status="Dikonfirmasi"         onclick="setFilter(this,'Dikonfirmasi')">Dikonfirmasi</button>
        <button class="filter-chip"        data-status="Aktif"                onclick="setFilter(this,'Aktif')">Aktif</button>
        <button class="filter-chip"        data-status="Selesai"              onclick="setFilter(this,'Selesai')">Selesai</button>
        <button class="filter-chip"        data-status="Dibatalkan"           onclick="setFilter(this,'Dibatalkan')">Dibatalkan</button>
      </div>

      <!-- Orders list -->
      <div id="ordersList">
        <div style="text-align:center;padding:3rem;color:var(--color-text-muted);">
          <i class='bx bx-loader-alt' style="font-size:2.5rem;animation:spin 1s linear infinite;display:block;"></i>
          <p style="margin-top:0.5rem;">Memuat pesanan...</p>
        </div>
      </div>

    </main>

    <footer style="text-align:center;color:var(--color-text-subtle);font-size:0.75rem;padding:1.25rem;">&copy; 2026 EasyCar</footer>
  </div>

  <!-- Detail Modal -->
  <div id="detailOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:#fff;z-index:1;border-radius:24px 24px 0 0;">
        <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Detail Pesanan</h3>
        <button onclick="closeDetail()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);">✕</button>
      </div>
      <div id="detailContent" style="padding:1.5rem;"></div>
      <div style="padding:0 1.5rem 1.5rem;display:flex;flex-direction:column;gap:0.625rem;">
        <button id="printInvoiceBtn" onclick="printInvoice()" class="btn btn-sm" style="width:100%;justify-content:center;background:#1e293b;color:#fff;border-color:#1e293b;display:none;">
          <i class='bx bx-printer'></i> Cetak Invoice
        </button>
        <a id="waAdminBtn" href="#" target="_blank" class="btn btn-sm" style="width:100%;justify-content:center;background:#16a34a;color:#fff;border-color:#16a34a;display:none;">
          <i class='bx bxl-whatsapp'></i> Hubungi Admin via WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- Invoice Print Modal -->
  <div id="invoiceOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:220;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#f1f5f9;border-radius:16px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #e2e8f0;background:#fff;border-radius:16px 16px 0 0;">
        <h4 style="font-family:var(--font-body);font-weight:700;color:var(--color-primary);margin:0;">Cetak Invoice</h4>
        <div style="display:flex;gap:0.5rem;">
          <button onclick="doPrintInvoice()" class="btn btn-sm" style="background:#1e293b;color:#fff;border-color:#1e293b;"><i class='bx bx-printer'></i> Print</button>
          <button onclick="closeInvoiceModal()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:#64748b;">✕</button>
        </div>
      </div>
      <div style="padding:1.25rem;display:flex;justify-content:center;">
        <div id="invoiceCard" style="width:280px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;font-family:'Courier New',monospace;">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/supabase.js"></script>
  <script src="/components/user-sidebar.js"></script>
  <script src="/utils/ui.js"></script>

  <script>
    let allOrders   = [];
    let activeFilter = "all";
    let openBookingId = null;

    (async () => {
      const user = await requireLogin();
      if (!user) return;

      initUserSidebar("my-orders", user);
      await loadOrders(user.id);
      document.body.classList.add("ec-ready");
    })();

    async function loadOrders(userId) {
      const { data } = await supabase
        .from("bookings")
        .select("*, cars(nama, foto_url, tipe, transmisi)")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });

      allOrders = data || [];
      renderOrders();
    }

    function setFilter(btn, status) {
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = status;
      renderOrders();
    }

    function renderOrders() {
      const list = document.getElementById("ordersList");
      const filtered = activeFilter === "all"
        ? allOrders
        : allOrders.filter(o => o.status === activeFilter);

      if (!filtered.length) {
        list.innerHTML = `
          <div style="text-align:center;padding:4rem 1rem;">
            <i class='bx bxs-receipt' style="font-size:3rem;color:var(--color-text-subtle);"></i>
            <p style="color:var(--color-text-muted);margin-top:0.75rem;font-weight:500;">Belum ada pesanan ${activeFilter === "all" ? "" : "dengan status <strong>" + activeFilter + "</strong>"}</p>
            <a href="/pages/user/booking.html" class="btn btn-accent" style="display:inline-flex;margin-top:1rem;">
              <i class='bx bx-plus'></i> Buat Pesanan
            </a>
          </div>
        `;
        return;
      }

      list.innerHTML = `<div style="display:flex;flex-direction:column;gap:1rem;">` +
        filtered.map(o => orderCardHTML(o)).join("") +
        `</div>`;
    }

    function orderCardHTML(o) {
      const car   = o.cars || {};
      const img   = car.foto_url
        ? `<img src="${car.foto_url}" style="width:80px;height:60px;object-fit:cover;border-radius:var(--radius-md);flex-shrink:0;" />`
        : `<div style="width:80px;height:60px;background:var(--color-bg);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class='bx bxs-car' style="font-size:1.5rem;color:var(--color-text-subtle);"></i></div>`;
      const kode  = o.kode_booking || ("BK" + o.id.slice(-6).toUpperCase());

      return `
        <div class="card order-card" style="padding:1.25rem;cursor:pointer;" onclick="openDetail('${o.id}')">
          <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
            ${img}
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;">
                <div>
                  <p style="font-weight:700;color:var(--color-primary);font-size:0.9375rem;margin:0 0 0.2rem;">${car.nama || "Kendaraan"}</p>
                  <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;font-family:monospace;font-weight:600;">${kode}</p>
                </div>
                <span class="badge ${statusBadgeClass(o.status)}">${o.status}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:1rem;margin-top:0.75rem;">
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Tanggal</p>
                  <p style="font-size:0.8125rem;font-weight:600;color:var(--color-text);margin:0;">${formatTanggalShort(o.tanggal_mulai)} — ${formatTanggalShort(o.tanggal_selesai)}</p>
                </div>
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Durasi</p>
                  <p style="font-size:0.8125rem;font-weight:600;color:var(--color-text);margin:0;">${o.durasi_hari || "—"} hari</p>
                </div>
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Total</p>
                  <p style="font-size:0.8125rem;font-weight:700;color:var(--color-accent);margin:0;">${formatRupiah(o.total_harga || 0)}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openDetail(id) {
      const o = allOrders.find(x => x.id === id);
      if (!o) return;
      openBookingId = id;
      const car   = o.cars || {};
      const kode  = o.kode_booking || ("BK" + o.id.slice(-6).toUpperCase());

      document.getElementById("detailContent").innerHTML = `
        <div style="display:flex;flex-direction:column;gap:0.875rem;">
          <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:1rem;display:flex;align-items:center;gap:0.875rem;margin-bottom:0.5rem;">
            ${car.foto_url ? `<img src="${car.foto_url}" style="width:72px;height:52px;object-fit:cover;border-radius:var(--radius-md);flex-shrink:0;" />` : ""}
            <div>
              <p style="font-weight:700;color:var(--color-primary);margin:0 0 0.15rem;">${car.nama || "—"}</p>
              <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;">${car.tipe || ""} ${car.transmisi ? "· " + car.transmisi : ""}</p>
            </div>
          </div>
          ${row("Kode Booking", `<code style="font-family:monospace;font-weight:700;">${kode}</code>`)}
          ${row("Status", `<span class="badge ${statusBadgeClass(o.status)}">${o.status}</span>`)}
          ${row("Tanggal Mulai", formatTanggal(o.tanggal_mulai))}
          ${row("Tanggal Selesai", formatTanggal(o.tanggal_selesai))}
          ${row("Durasi", (o.durasi_hari || "—") + " hari")}
          ${row("Nama Pemesan", o.nama_pemesan || "—")}
          ${row("No. HP", o.no_hp || "—")}
          ${o.catatan ? row("Catatan", o.catatan) : ""}
          <div style="border-top:2px solid var(--color-border);padding-top:0.875rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <span style="font-size:0.8125rem;color:var(--color-text-muted);">Total Harga</span>
              <span style="font-size:1.1rem;font-weight:800;color:var(--color-accent);">${formatRupiah(o.total_harga || 0)}</span>
            </div>
            ${o.dp_amount ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem;">
              <span style="font-size:0.75rem;color:var(--color-text-muted);">DP (30%)</span>
              <span style="font-size:0.75rem;font-weight:600;color:var(--color-text);">${formatRupiah(o.dp_amount)}</span>
            </div>` : ""}
            ${o.deposit_amount ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem;">
              <span style="font-size:0.75rem;color:var(--color-text-muted);">Deposit Jaminan</span>
              <span style="font-size:0.75rem;font-weight:600;color:var(--color-text);">${formatRupiah(o.deposit_amount)}</span>
            </div>` : ""}
            ${o.sisa_pelunasan ? `<div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:0.75rem;color:var(--color-text-muted);">Sisa Pelunasan</span>
              <span style="font-size:0.75rem;font-weight:600;color:#dc2626;">${formatRupiah(o.sisa_pelunasan)}</span>
            </div>` : ""}
          </div>
        </div>
      `;

      // Show cetak invoice button
      document.getElementById("printInvoiceBtn").style.display = "flex";

      // WA button
      const ADMIN_WA = "6282276100996";
      const waMsg = encodeURIComponent(`Halo Admin EasyCar, saya ingin menanyakan pesanan saya:\nKode: ${kode}\nNama: ${o.nama_pemesan || ""}\nMobil: ${car.nama || ""}\nTanggal: ${o.tanggal_mulai} s/d ${o.tanggal_selesai}`);
      document.getElementById("waAdminBtn").href = `https://wa.me/${ADMIN_WA}?text=${waMsg}`;
      document.getElementById("waAdminBtn").style.display = "flex";

      document.getElementById("detailOverlay").style.display = "flex";
    }

    function row(label, val) {
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;">
          <span style="font-size:0.8125rem;color:var(--color-text-muted);">${label}</span>
          <span style="font-size:0.8125rem;font-weight:600;color:var(--color-text);text-align:right;">${val}</span>
        </div>
      `;
    }

    function closeDetail() {
      document.getElementById("detailOverlay").style.display = "none";
      openBookingId = null;
    }

    document.getElementById("detailOverlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeDetail();
    });

    // ── CETAK INVOICE ──
    function printInvoice() {
      if (!openBookingId) return;
      const o = allOrders.find(x => x.id === openBookingId);
      if (!o) return;
      const car  = o.cars || {};
      const kode = o.kode_booking || ("BK" + o.id.slice(-6).toUpperCase());
      const total    = o.total_harga || 0;
      const dp       = o.dp_amount || 0;
      const deposit  = o.deposit_amount || 0;
      const bayarNow = dp + deposit;
      const sisa     = o.sisa_pelunasan || (total - dp);

      const rows = [
        { label: "Sewa (" + (o.durasi_hari||"?") + " hari)", val: formatRupiah(total) },
        ...(dp > 0 ? [{ label: "DP dibayar (30%)", val: formatRupiah(dp), accent: true }] : []),
        { label: "Deposit Jaminan", val: formatRupiah(deposit), accent: true },
        { label: "Total dibayar", val: formatRupiah(bayarNow), total: true },
        ...(sisa > 0 ? [{ label: "Sisa pelunasan", val: formatRupiah(sisa), muted: true }] : []),
      ];

      document.getElementById("invoiceCard").innerHTML = `
        <div style="background:#1e293b;padding:0.875rem;text-align:center;">
          <div style="display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:0.2rem;">
            <div style="width:24px;height:24px;background:#e85d04;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <i class='bx bxs-car' style="color:#fff;font-size:0.75rem;"></i>
            </div>
            <span style="font-family:'Poppins',sans-serif;font-weight:800;color:#fff;font-size:1rem;">Easy<span style="color:#fb923c;">Car</span></span>
          </div>
          <p style="font-size:0.6rem;color:rgba(255,255,255,0.55);margin:0;">Rental Kendaraan — Pekanbaru, Riau</p>
        </div>
        <div style="padding:0.875rem;border-bottom:1px dashed #e2e8f0;">
          <p style="font-size:0.65rem;color:#94a3b8;margin:0 0 0.1rem;text-align:center;">INVOICE / KWITANSI</p>
          <p style="font-size:0.8rem;font-weight:700;color:#1e293b;margin:0;text-align:center;font-family:'Poppins',sans-serif;">${kode}</p>
          <p style="font-size:0.575rem;color:#94a3b8;margin:0.2rem 0 0;text-align:center;">Dicetak: ${new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})}</p>
        </div>
        <div style="padding:0.75rem 0.875rem;border-bottom:1px dashed #e2e8f0;font-size:0.625rem;">
          <p style="color:#475569;margin:0 0 0.15rem;"><strong>Pemesan:</strong> ${o.nama_pemesan||"—"}</p>
          ${o.no_ktp ? `<p style="color:#475569;margin:0 0 0.15rem;">KTP: ${o.no_ktp}</p>` : ""}
          ${o.no_hp ? `<p style="color:#475569;margin:0;">WA: ${o.no_hp}</p>` : ""}
        </div>
        <div style="padding:0.75rem 0.875rem;border-bottom:1px dashed #e2e8f0;font-size:0.625rem;">
          <p style="color:#475569;margin:0 0 0.15rem;"><strong>Kendaraan:</strong> ${car.nama||"—"}</p>
          <p style="color:#475569;margin:0 0 0.15rem;">Periode: ${formatTanggalShort(o.tanggal_mulai)} s/d ${formatTanggalShort(o.tanggal_selesai)}</p>
          <p style="color:#475569;margin:0;">Durasi: ${o.durasi_hari||"—"} hari</p>
        </div>
        <div style="padding:0.75rem 0.875rem;border-bottom:1px dashed #e2e8f0;">
          <table style="width:100%;font-size:0.6rem;border-collapse:collapse;">
            ${rows.map(r => `
              <tr>
                <td style="padding:0.15rem 0;${r.muted?'color:#94a3b8;font-size:0.575rem;':'color:#475569;'}${r.total?'font-weight:700;color:#1e293b;border-top:1px dashed #cbd5e1;padding-top:0.3rem;':''}">${r.label}</td>
                <td style="padding:0.15rem 0;text-align:right;white-space:nowrap;${r.muted?'color:#94a3b8;font-size:0.575rem;':''}${r.accent?'color:#e85d04;font-weight:700;':''}${r.total?'color:#e85d04;font-weight:800;border-top:1px dashed #cbd5e1;padding-top:0.3rem;':''}">${r.val}</td>
              </tr>
            `).join("")}
          </table>
        </div>
        <div style="padding:0.75rem 0.875rem;text-align:center;">
          <p style="font-size:0.575rem;color:#94a3b8;margin:0;">Status: <strong style="color:${o.status==='Selesai'?'#16a34a':o.status==='Aktif'?'#2563eb':'#f59e0b'}">${o.status}</strong></p>
          <p style="font-size:0.55rem;color:#cbd5e1;margin:0.25rem 0 0;">Terima kasih telah menggunakan EasyCar</p>
        </div>
      `;

      closeDetail();
      document.getElementById("invoiceOverlay").style.display = "flex";
    }

    function closeInvoiceModal() {
      document.getElementById("invoiceOverlay").style.display = "none";
    }

    document.getElementById("invoiceOverlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeInvoiceModal();
    });

    function doPrintInvoice() {
      const card = document.getElementById("invoiceCard");
      const w = window.open("", "_blank", "width=400,height=700");
      w.document.write(`<!DOCTYPE html><html><head>
        <title>Invoice EasyCar</title>
        <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
        <style>
          @page { size: 80mm auto; margin: 0.3cm; }
          body { margin:0; background:#fff; font-family:'Courier New',monospace; }
          @media print { body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
        </style>
      </head><body>${card.outerHTML}<script>window.onload=function(){window.print();window.close();}<\/script></body></html>`);
      w.document.close();
    }
  </script>
</body>
</html>
