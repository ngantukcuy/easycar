<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Pesanan Saya</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    body.ec-loading { visibility: hidden; }
    .order-card { transition: box-shadow 0.2s; }
    .order-card:hover { box-shadow: var(--shadow-md); }
  </style>
</head>
<body class="ec-loading">

  <div class="page-wrapper">
    <header class="page-topbar">
      <div style="padding-left:3rem;">
        <h2 style="font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Pesanan Saya</h2>
        <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;">Riwayat dan status pesanan Anda</p>
      </div>
      <a href="/pages/user/booking.html" class="btn btn-accent btn-sm">
        <i class='bx bx-plus'></i> Booking Baru
      </a>
    </header>

    <main class="page-content fade-in">

      <!-- Filter tabs -->
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem;">
        <button class="filter-chip active" data-status="all"          onclick="setFilter(this,'all')">Semua</button>
        <button class="filter-chip"        data-status="Menunggu Konfirmasi" onclick="setFilter(this,'Menunggu Konfirmasi')">Menunggu</button>
        <button class="filter-chip"        data-status="Dikonfirmasi" onclick="setFilter(this,'Dikonfirmasi')">Dikonfirmasi</button>
        <button class="filter-chip"        data-status="Aktif"        onclick="setFilter(this,'Aktif')">Aktif</button>
        <button class="filter-chip"        data-status="Selesai"      onclick="setFilter(this,'Selesai')">Selesai</button>
        <button class="filter-chip"        data-status="Dibatalkan"   onclick="setFilter(this,'Dibatalkan')">Dibatalkan</button>
      </div>

      <!-- Orders list -->
      <div id="ordersList">
        <div style="text-align:center;padding:3rem;color:var(--color-text-muted);">
          <i class='bx bx-loader-alt' style="font-size:2.5rem;animation:spin 1s linear infinite;display:block;"></i>
          <p style="margin-top:0.5rem;">Memuat pesanan...</p>
        </div>
      </div>

    </main>

    <footer style="text-align:center;color:var(--color-text-subtle);font-size:0.75rem;padding:1.25rem;">&copy; 2026 EasyCar</footer>
  </div>

  <!-- Detail Modal -->
  <div id="detailOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--color-border);">
        <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;">Detail Pesanan</h3>
        <button onclick="closeDetail()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);">✕</button>
      </div>
      <div id="detailContent" style="padding:1.5rem;"></div>
      <div style="padding:0 1.5rem 1.5rem;display:flex;flex-direction:column;gap:0.625rem;">
        <a id="waAdminBtn" href="#" target="_blank" class="btn btn-sm" style="width:100%;justify-content:center;background:#16a34a;color:#fff;border-color:#16a34a;display:none;">
          <i class='bx bxl-whatsapp'></i> Hubungi Admin via WhatsApp
        </a>
        <button id="cetakBtn" onclick="cetakInvoice()" class="btn btn-ghost" style="width:100%;justify-content:center;display:none;">
          <i class='bx bx-printer'></i> Cetak Invoice
        </button>
        <button id="cancelBtn" onclick="cancelBooking()" class="btn btn-danger" style="width:100%;justify-content:center;display:none;">
          <i class='bx bx-x-circle'></i> Batalkan Pesanan
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/supabase.js"></script>
  <script src="/components/user-sidebar.js"></script>
  <script src="/utils/ui.js"></script>

  <script>
    let allOrders   = [];
    let activeFilter = "all";
    let openBookingId = null;

    // Filter chip style
    document.head.insertAdjacentHTML("beforeend", `
      <style>
        .filter-chip { padding:0.4rem 1rem;border-radius:999px;border:1.5px solid var(--color-border);background:var(--color-surface);font-size:0.8125rem;font-weight:600;color:var(--color-text-muted);cursor:pointer;transition:all 0.15s;font-family:var(--font-body); }
        .filter-chip:hover { border-color:var(--color-primary-mid);color:var(--color-primary-mid); }
        .filter-chip.active { background:var(--color-primary-mid);border-color:var(--color-primary-mid);color:#fff; }
        @keyframes spin { to { transform:rotate(360deg); } }
      </style>
    `);

    (async () => {
      const user = await requireLogin();
      if (!user) return;

      initUserSidebar("my-orders", user);
      await loadOrders(user.id);
      document.body.classList.add("ec-ready");
    })();

    async function loadOrders(userId) {
      const { data } = await supabase
        .from("bookings")
        .select("*, cars(nama, foto_url, tipe, transmisi)")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });

      allOrders = data || [];
      renderOrders();
    }

    function setFilter(btn, status) {
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = status;
      renderOrders();
    }

    function renderOrders() {
      const list = document.getElementById("ordersList");
      const filtered = activeFilter === "all"
        ? allOrders
        : allOrders.filter(o => o.status === activeFilter);

      if (!filtered.length) {
        list.innerHTML = `
          <div style="text-align:center;padding:4rem 1rem;">
            <i class='bx bxs-receipt' style="font-size:3rem;color:var(--color-text-subtle);"></i>
            <p style="color:var(--color-text-muted);margin-top:0.75rem;font-weight:500;">Belum ada pesanan ${activeFilter === "all" ? "" : "dengan status " + activeFilter}</p>
            <a href="/pages/user/booking.html" class="btn btn-accent" style="display:inline-flex;margin-top:1rem;">
              <i class='bx bx-plus'></i> Buat Pesanan
            </a>
          </div>
        `;
        return;
      }

      list.innerHTML = `<div style="display:flex;flex-direction:column;gap:1rem;">` +
        filtered.map(o => orderCardHTML(o)).join("") +
        `</div>`;
    }

    function orderCardHTML(o) {
      const car   = o.cars || {};
      const img   = car.foto_url
        ? `<img src="${car.foto_url}" style="width:80px;height:60px;object-fit:cover;border-radius:var(--radius-md);flex-shrink:0;" />`
        : `<div style="width:80px;height:60px;background:var(--color-bg);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class='bx bxs-car' style="font-size:1.5rem;color:var(--color-text-subtle);"></i></div>`;
      const kode  = o.kode_booking || ("BK" + o.id.slice(-6).toUpperCase());
      const canCancel = ["Menunggu", "Menunggu Konfirmasi"].includes(o.status);

      return `
        <div class="card order-card" style="padding:1.25rem;cursor:pointer;" onclick="openDetail('${o.id}')">
          <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
            ${img}
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;">
                <div>
                  <p style="font-weight:700;color:var(--color-primary);font-size:0.9375rem;margin:0 0 0.2rem;">${car.nama || "Kendaraan"}</p>
                  <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;font-family:monospace;font-weight:600;">${kode}</p>
                </div>
                <span class="badge ${statusBadgeClass(o.status)}">${o.status}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:1rem;margin-top:0.75rem;">
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Tanggal</p>
                  <p style="font-size:0.8125rem;font-weight:600;color:var(--color-text);margin:0;">${formatTanggalShort(o.tanggal_mulai)} — ${formatTanggalShort(o.tanggal_selesai)}</p>
                </div>
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Durasi</p>
                  <p style="font-size:0.8125rem;font-weight:600;color:var(--color-text);margin:0;">${o.durasi_hari || "—"} hari</p>
                </div>
                <div>
                  <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Total</p>
                  <p style="font-size:0.8125rem;font-weight:700;color:var(--color-accent);margin:0;">${formatRupiah(o.total_harga || 0)}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openDetail(id) {
      const o = allOrders.find(x => x.id === id);
      if (!o) return;
      openBookingId = id;
      const car   = o.cars || {};
      const kode  = o.kode_booking || ("BK" + o.id.slice(-6).toUpperCase());
      const canCancel = ["Menunggu", "Menunggu Konfirmasi"].includes(o.status);

      document.getElementById("detailContent").innerHTML = `
        <div style="display:flex;flex-direction:column;gap:0.875rem;">
          <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:1rem;display:flex;align-items:center;gap:0.875rem;margin-bottom:0.5rem;">
            ${car.foto_url ? `<img src="${car.foto_url}" style="width:72px;height:52px;object-fit:cover;border-radius:var(--radius-md);flex-shrink:0;" />` : ""}
            <div>
              <p style="font-weight:700;color:var(--color-primary);margin:0 0 0.15rem;">${car.nama || "—"}</p>
              <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;">${car.tipe || ""} ${car.transmisi ? "· " + car.transmisi : ""}</p>
            </div>
          </div>
          ${row("Kode Booking", `<code style="font-family:monospace;font-weight:700;">${kode}</code>`)}
          ${row("Status", `<span class="badge ${statusBadgeClass(o.status)}">${o.status}</span>`)}
          ${row("Tanggal Mulai", formatTanggal(o.tanggal_mulai))}
          ${row("Tanggal Selesai", formatTanggal(o.tanggal_selesai))}
          ${row("Durasi", (o.durasi_hari || "—") + " hari")}
          ${row("Nama Pemesan", o.nama_pemesan || "—")}
          ${row("No. HP", o.no_hp || "—")}
          ${o.catatan ? row("Catatan", o.catatan) : ""}
          <div style="border-top:2px solid var(--color-border);padding-top:0.875rem;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:700;color:var(--color-primary);">Total Harga</span>
            <span style="font-size:1.25rem;font-weight:800;color:var(--color-accent);">${formatRupiah(o.total_harga || 0)}</span>
          </div>
        </div>
      `;

      document.getElementById("cancelBtn").style.display = canCancel ? "flex" : "none";
      document.getElementById("cetakBtn").style.display = "flex";

      // WA button — always show so user can contact admin for any reason
      const ADMIN_WA = "6282276100996"; // ganti dengan nomor WA admin
      const kodeText = kode;
      const waMsg = encodeURIComponent(`Halo Admin EasyCar, saya ingin menanyakan pesanan saya:\nKode: ${kodeText}\nNama: ${o.nama_pemesan || ""}\nMobil: ${car.nama || ""}\nTanggal: ${o.tanggal_mulai} s/d ${o.tanggal_selesai}`);
      document.getElementById("waAdminBtn").href = `https://wa.me/${ADMIN_WA}?text=${waMsg}`;
      document.getElementById("waAdminBtn").style.display = "flex";

      document.getElementById("detailOverlay").style.display = "flex";
    }

    function row(label, val) {
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;">
          <span style="font-size:0.8125rem;color:var(--color-text-muted);">${label}</span>
          <span style="font-size:0.8125rem;font-weight:600;color:var(--color-text);text-align:right;">${val}</span>
        </div>
      `;
    }

    function closeDetail() {
      document.getElementById("detailOverlay").style.display = "none";
      openBookingId = null;
    }

    document.getElementById("detailOverlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeDetail();
    });

    function cetakInvoice() {
      const o = allOrders.find(x => x.id === openBookingId);
      if (!o) return;
      const car = o.cars || {};
      const kode = o.kode_booking || ("BK" + o.id.slice(-6).toUpperCase());
      const total = o.total_harga || 0;
      const dp = o.dp_amount || 0;
      const deposit = o.deposit_amount || 0;
      const bayarNow = o.sudah_dibayar || (dp + deposit);
      const sisa = o.sisa_pelunasan || (total - dp);

      const w = window.open('', '_blank', 'width=700,height=900');
      w.document.write(`
        <!DOCTYPE html><html><head>
        <meta charset="UTF-8"/>
        <title>Invoice ${kode}</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
        <style>
          body{font-family:'Poppins',sans-serif;background:#f1f5f9;margin:0;padding:2rem;}
          .inv{max-width:620px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.1);}
          .inv-header{padding:1.5rem 2rem;border-bottom:2px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
          .brand{display:flex;align-items:center;gap:0.625rem;}
          .brand-icon{width:36px;height:36px;background:#e85d04;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;}
          .brand-name{font-weight:800;font-size:1.125rem;color:#0f2347;}
          .brand-sub{font-size:0.7rem;color:#94a3b8;}
          .inv-body{padding:1.5rem 2rem;}
          .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
          .label{font-size:0.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 0.5rem;}
          table{width:100%;border-collapse:collapse;font-size:0.8125rem;margin-bottom:1.5rem;}
          th{text-align:left;padding:0.625rem 0.75rem;font-weight:600;color:#94a3b8;border-bottom:2px solid #e2e8f0;}
          td{padding:0.5rem 0.75rem;border-bottom:1px solid #f1f5f9;}
          .badge-warn{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;}
          .footer{border-top:1px solid #e2e8f0;padding-top:1rem;font-size:0.7rem;color:#94a3b8;display:flex;justify-content:space-between;}
          @media print{body{background:white;padding:0;} @page{margin:1.5cm;size:A4;}}
        </style>
        </head><body>
        <div class="inv">
          <div class="inv-header">
            <div class="brand">
              <div class="brand-icon">🚗</div>
              <div><div class="brand-name">Easy<span style="color:#e85d04">Car</span></div><div class="brand-sub">Rental Kendaraan</div></div>
            </div>
            <div style="text-align:right">
              <div style="font-size:0.75rem;font-weight:700;color:#94a3b8;">INVOICE / TANDA TERIMA BOOKING</div>
              <div style="font-size:1rem;font-weight:800;color:#0f2347;font-family:monospace;">${kode}</div>
            </div>
          </div>
          <div class="inv-body">
            <div class="grid2">
              <div>
                <div class="label">Data Pemesan</div>
                <div style="font-weight:700;color:#0f2347;font-size:0.875rem;">${o.nama_pemesan || '—'}</div>
                <div style="font-size:0.75rem;color:#64748b;">KTP: ${o.no_ktp || '—'}</div>
                <div style="font-size:0.75rem;color:#64748b;">WA: ${o.no_hp || '—'}</div>
                <div style="font-size:0.75rem;color:#64748b;">${o.alamat || ''}</div>
              </div>
              <div>
                <div class="label">Detail Sewa</div>
                <div style="font-weight:700;color:#0f2347;font-size:0.875rem;">${car.nama || '—'}</div>
                <div style="font-size:0.75rem;color:#64748b;">${o.tanggal_mulai || '—'} s/d ${o.tanggal_selesai || '—'}</div>
                <div style="font-size:0.75rem;color:#64748b;">${o.durasi_hari || '—'} hari</div>
                <div style="font-size:0.7rem;color:#94a3b8;">Dibuat: ${new Date(o.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>
              </div>
            </div>
            <table>
              <thead><tr><th>Keterangan</th><th style="text-align:right">Jumlah</th></tr></thead>
              <tbody>
                <tr><td>Total Sewa (${o.durasi_hari||'—'} hari)</td><td style="text-align:right;font-weight:600">${new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(total)}</td></tr>
                ${dp > 0 ? '<tr><td>DP Dibayar (30%)</td><td style="text-align:right;font-weight:600;color:#e85d04">'+new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(dp)+'</td></tr>' : ''}
                <tr><td>Deposit</td><td style="text-align:right;font-weight:600;color:#e85d04">${new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(deposit)}</td></tr>
                <tr style="background:#f8fafc;font-weight:700"><td>Total Dibayar Sekarang</td><td style="text-align:right;color:#e85d04;font-size:1rem">${new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(bayarNow)}</td></tr>
                <tr><td style="color:#64748b;font-size:0.75rem">Sisa Pelunasan saat Pengambilan</td><td style="text-align:right;color:#64748b;font-size:0.75rem">${new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(sisa)}</td></tr>
              </tbody>
            </table>
            <div class="badge-warn">
              <div style="font-size:0.75rem;font-weight:700;color:#9a3412">STATUS: ${o.status || 'MENUNGGU KONFIRMASI'}</div>
              <div style="font-size:0.75rem;color:#c2410c">📌 Bawa invoice ini saat pengambilan kendaraan</div>
            </div>
            <div class="footer">
              <span>EasyCar — Pekanbaru, Riau</span>
              <span>Dicetak: ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</span>
            </div>
          </div>
        </div>
        <div style="text-align:center;margin-top:1.5rem;">
          <button onclick="window.print()" style="padding:0.625rem 1.5rem;background:#0f2347;color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer;font-size:0.875rem;">🖨️ Cetak / Simpan PDF</button>
        </div>
        </body></html>
      `);
      w.document.close();
    }

    async function cancelBooking() {
      if (!openBookingId) return;
      const confirmed = await showModal({
        title: "Batalkan Pesanan?",
        message: "Apakah Anda yakin ingin membatalkan pesanan ini? Tindakan ini tidak dapat dibatalkan.",
        confirmText: "Ya, Batalkan",
        cancelText: "Tidak",
        type: "danger"
      });
      if (!confirmed) return;

      showLoading("Membatalkan pesanan...");
      const { error } = await supabase
        .from("bookings")
        .update({ status: "Dibatalkan" })
        .eq("id", openBookingId);
      hideLoading();

      if (error) {
        showToast("Gagal membatalkan: " + error.message, "error"); return;
      }

      showToast("Pesanan berhasil dibatalkan.", "success");
      closeDetail();

      // Refresh
      const user = await getCurrentUser();
      if (user) await loadOrders(user.id);
    }
  </script>
</body>
</html>
