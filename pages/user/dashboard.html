<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    body.ec-loading { visibility: hidden; }
    .car-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1.5px solid var(--color-border);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    .car-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      border-color: var(--color-accent);
    }
    .car-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: var(--color-bg);
      display: block;
    }
    .car-img-placeholder {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spec-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: var(--color-bg);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }
    .hero-banner {
      background: linear-gradient(135deg, var(--color-primary) 0%, #1a3c6e 60%, #e85d04 100%);
      border-radius: 20px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .hero-banner::before {
      content: '';
      position: absolute;
      right: -40px;
      top: -40px;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      right: 80px;
      bottom: -60px;
      width: 140px;
      height: 140px;
      background: rgba(232,93,4,0.2);
      border-radius: 50%;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    @media (max-width: 600px) {
      .cars-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .car-img, .car-img-placeholder { height: 130px; }
      .hero-banner { padding: 1.25rem; }
    }
    @media (max-width: 380px) {
      .cars-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="ec-loading">

  <div class="page-wrapper">
    <header class="page-topbar">
      <div style="padding-left:3rem;">
        <h2 style="font-size:1rem;font-weight:700;color:var(--color-primary);margin:0;" id="topbarGreet">Selamat Datang</h2>
        <p style="font-size:0.75rem;color:var(--color-text-muted);margin:0;" id="topbarDate">—</p>
      </div>
    </header>

    <main class="page-content fade-in">

      <!-- Hero Banner -->
      <div class="hero-banner">
        <div style="position:relative;z-index:1;">
          <p style="color:rgba(255,255,255,0.6);font-size:0.8rem;margin:0 0 0.3rem;">Halo, <span id="welcomeName" style="color:#fb923c;font-weight:700;">—</span> 👋</p>
          <h2 style="color:#fff;font-size:1.5rem;font-weight:800;margin:0 0 0.5rem;line-height:1.2;">Mau pergi kemana hari ini?</h2>
          <p style="color:rgba(255,255,255,0.55);font-size:0.825rem;margin:0 0 1.25rem;">Pilih kendaraan impianmu dan nikmati perjalanan bersama EasyCar.</p>
          <div style="display:flex;gap:0.625rem;flex-wrap:wrap;">
            <a href="/pages/user/booking.html" class="btn btn-accent btn-sm">
              <i class='bx bxs-calendar-plus'></i> Booking Sekarang
            </a>
            <a href="/pages/user/my-orders.html" class="btn btn-sm" style="background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.2);">
              <i class='bx bxs-receipt'></i> Pesanan Saya
            </a>
          </div>
        </div>
      </div>

      <!-- Search & Filter -->
      <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;flex-wrap:wrap;">
        <h3 style="font-size:0.9375rem;font-weight:700;color:var(--color-primary);margin:0;flex:1;">Armada Tersedia</h3>
        <div style="position:relative;">
          <i class='bx bx-search' style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);font-size:1rem;pointer-events:none;"></i>
          <input type="text" id="searchCar" oninput="filterCars()" placeholder="Cari kendaraan..." class="ec-input" style="padding-left:2.25rem;width:200px;min-width:140px;" />
        </div>
        <select id="filterTipe" onchange="filterCars()" class="ec-input" style="width:auto;min-width:110px;">
          <option value="">Semua Tipe</option>
          <option value="Minibus">Minibus</option>
          <option value="SUV">SUV</option>
          <option value="MPV">MPV</option>
          <option value="Sedan">Sedan</option>
          <option value="Pickup">Pickup</option>
        </select>
      </div>

      <!-- Cars Grid -->
      <div id="carsGrid" class="cars-grid">
        <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--color-text-muted);">
          <i class='bx bx-loader-alt' style="font-size:2.5rem;animation:spin 1s linear infinite;display:block;"></i>
          <p style="margin-top:0.5rem;">Memuat kendaraan...</p>
        </div>
      </div>

    </main>

    <footer style="text-align:center;color:var(--color-text-subtle);font-size:0.75rem;padding:1.25rem;">&copy; 2026 EasyCar</footer>
  </div>

  <!-- Car Detail Modal -->
  <div id="carModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;">
      <div id="carModalContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/supabase.js"></script>
  <script src="/services/realtime.js"></script>
  <script src="/services/print.js"></script>
  <script src="/components/user-sidebar.js"></script>
  <script src="/utils/ui.js"></script>

  <script>
    let allCars = [];
    let filteredCars = [];
    let _dashUser = null;

    (async () => {
      const user = await requireLogin();
      if (!user) return;
      _dashUser = user;

      initUserSidebar("dashboard", user);
      injectTopbarNotifBell();

      document.getElementById("welcomeName").textContent = (user.full_name || user.email || "").split(" ")[0] || "—";
      document.getElementById("topbarGreet").textContent = getGreeting() + ", " + ((user.full_name || user.email || "").split(" ")[0] || "");
      document.getElementById("topbarDate").textContent = new Date().toLocaleDateString("id-ID", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });

      await loadCars();
      document.body.classList.add("ec-ready");

      // ── REALTIME: notifikasi update booking di dashboard ──
      EasyCarRealtime.subscribeUserBookings(user.id, {
        onUpdate: (payload) => {
          const status = payload.new?.status;
          // Update badge di sidebar
          if (status === "Dikonfirmasi" || status === "Ditolak") {
            setSidebarBadge(1);
          }
        },
      });
    })();

    function getGreeting() {
      const h = new Date().getHours();
      if (h < 11) return "Selamat Pagi";
      if (h < 15) return "Selamat Siang";
      if (h < 18) return "Selamat Sore";
      return "Selamat Malam";
    }

    async function loadCars() {
      const { data } = await supabase
        .from("cars")
        .select("*")
        .eq("status", "Tersedia")
        .order("nama");

      allCars = data || [];
      filteredCars = [...allCars];
      renderCars();
    }

    function filterCars() {
      const q = document.getElementById("searchCar").value.toLowerCase().trim();
      const tipe = document.getElementById("filterTipe").value;
      filteredCars = allCars.filter(c => {
        const matchQ = !q || (c.nama||"").toLowerCase().includes(q) || (c.tipe||"").toLowerCase().includes(q) || (c.merek||"").toLowerCase().includes(q);
        const matchT = !tipe || c.tipe === tipe;
        return matchQ && matchT;
      });
      renderCars();
    }

    function renderCars() {
      const grid = document.getElementById("carsGrid");
      if (!filteredCars.length) {
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;">
            <i class='bx bxs-car' style="font-size:3rem;color:var(--color-text-subtle);display:block;"></i>
            <p style="color:var(--color-text-muted);margin-top:0.75rem;font-weight:500;">Tidak ada kendaraan ditemukan</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredCars.map(car => `
        <div class="car-card" onclick="openCarDetail('${car.id}')" style="cursor:pointer;">
          ${car.foto_url
            ? `<img src="${car.foto_url}" class="car-img" alt="${car.nama}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div class="car-img-placeholder" style="display:none;"><i class='bx bxs-car' style="font-size:3rem;color:#93c5fd;"></i></div>`
            : `<div class="car-img-placeholder"><i class='bx bxs-car' style="font-size:3rem;color:#93c5fd;"></i></div>`
          }
          <div style="padding:1rem;flex:1;display:flex;flex-direction:column;">
            <div style="display:flex;align-items:start;justify-content:space-between;gap:0.5rem;margin-bottom:0.5rem;">
              <div style="min-width:0;">
                <p style="font-weight:700;color:var(--color-primary);font-size:0.9375rem;margin:0 0 0.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${car.nama}</p>
                <p style="font-size:0.725rem;color:var(--color-text-muted);margin:0;">${car.tipe||""} ${car.transmisi ? "· "+car.transmisi : ""}</p>
              </div>
              <span style="flex-shrink:0;background:#dcfce7;color:#166534;font-size:0.65rem;font-weight:700;padding:0.2rem 0.5rem;border-radius:999px;">Tersedia</span>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:0.375rem;margin-bottom:0.875rem;">
              ${car.kapasitas ? `<span class="spec-chip"><i class='bx bxs-user'></i>${car.kapasitas} orang</span>` : ""}
              ${car.tahun ? `<span class="spec-chip"><i class='bx bx-calendar'></i>${car.tahun}</span>` : ""}
              ${car.warna ? `<span class="spec-chip"><i class='bx bx-palette'></i>${car.warna}</span>` : ""}
              ${car.bahan_bakar ? `<span class="spec-chip"><i class='bx bx-gas-pump'></i>${car.bahan_bakar}</span>` : ""}
              ${car.no_plat ? `<span class="spec-chip"><i class='bx bx-cog'></i>${car.no_plat}</span>` : ""}
              ${car.keterangan ? `<span class="spec-chip"><i class='bx bx-info-circle'></i>${car.keterangan}</span>` : ""}
              
            </div>

            <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;">
              <div>
                <p style="font-size:0.7rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Harga sewa</p>
                <p style="font-size:1rem;font-weight:800;color:var(--color-accent);margin:0;">${formatRupiah(car.harga_per_hari||0)}<span style="font-size:0.65rem;font-weight:400;color:var(--color-text-muted)">/hari</span></p>
              </div>
              <a href="/pages/user/booking.html?car_id=${car.id}" onclick="event.stopPropagation();" class="btn btn-accent btn-sm" style="flex-shrink:0;">
                Booking
              </a>
            </div>
          </div>
        </div>
      `).join("");
    }

    function openCarDetail(carId) {
      const car = allCars.find(c => c.id === carId);
      if (!car) return;

      document.getElementById("carModalContent").innerHTML = `
        ${car.foto_url
          ? `<img src="${car.foto_url}" style="width:100%;height:220px;object-fit:cover;border-radius:24px 24px 0 0;display:block;" onerror="this.style.display='none'" />`
          : `<div style="width:100%;height:160px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:24px 24px 0 0;display:flex;align-items:center;justify-content:center;"><i class='bx bxs-car' style="font-size:4rem;color:#93c5fd;"></i></div>`
        }
        <div style="padding:1.5rem;">
          <div style="display:flex;align-items:start;justify-content:space-between;gap:0.5rem;margin-bottom:0.75rem;">
            <div>
              <h3 style="font-size:1.1rem;font-weight:800;color:var(--color-primary);margin:0 0 0.2rem;">${car.nama}</h3>
              <p style="font-size:0.8rem;color:var(--color-text-muted);margin:0;">${car.tipe||""} ${car.transmisi ? "· "+car.transmisi : ""}</p>
            </div>
            <button onclick="closeCarModal()" style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-text-muted);flex-shrink:0;margin-top:-4px;">✕</button>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.25rem;">
            ${carSpec("Kapasitas", car.kapasitas ? car.kapasitas + " orang" : "—", "bxs-user")}
            ${carSpec("Tahun", car.tahun || "—", "bx-calendar")}
            ${carSpec("Bahan Bakar", car.bahan_bakar || "—", "bx-gas-pump")}
            ${carSpec("Transmisi", car.transmisi || "—", "bx-cog")}
            ${carSpec("Warna", car.warna || "—", "bx-palette")}
            ${carSpec("Plat Nomor", car.no_plat || "—", "bx-id-card")}
          </div>

          ${car.deskripsi ? `<p style="font-size:0.825rem;color:var(--color-text-muted);line-height:1.6;margin-bottom:1.25rem;">${car.deskripsi}</p>` : ""}

          <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem;background:var(--color-bg);border-radius:var(--radius-md);margin-bottom:1.25rem;">
            <div>
              <p style="font-size:0.725rem;color:var(--color-text-muted);margin:0 0 0.1rem;">Harga sewa per hari</p>
              <p style="font-size:1.375rem;font-weight:800;color:var(--color-accent);margin:0;">${formatRupiah(car.harga_per_hari||0)}</p>
            </div>
            <span style="background:#dcfce7;color:#166534;font-size:0.725rem;font-weight:700;padding:0.35rem 0.75rem;border-radius:999px;">Tersedia</span>
          </div>

          <a href="/pages/user/booking.html?car_id=${car.id}" class="btn btn-accent" style="width:100%;justify-content:center;font-size:0.9rem;">
            <i class='bx bxs-calendar-plus'></i> Booking Kendaraan Ini
          </a>
        </div>
      `;

      document.getElementById("carModal").style.display = "flex";
    }

    function carSpec(label, val, icon) {
      return `
        <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:0.75rem;">
          <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.2rem;">
            <i class='bx ${icon}' style="font-size:0.85rem;color:var(--color-primary-mid);"></i>
            <span style="font-size:0.675rem;color:var(--color-text-muted);font-weight:600;">${label}</span>
          </div>
          <p style="font-size:0.825rem;font-weight:700;color:var(--color-text);margin:0;">${val}</p>
        </div>
      `;
    }

    function closeCarModal() {
      document.getElementById("carModal").style.display = "none";
    }

    document.getElementById("carModal").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeCarModal();
    });
  </script>
</body>
</html>
