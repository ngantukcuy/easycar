<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Masuk / Daftar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #0f2347 0%, #1a3c6e 55%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 1.5rem;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }
    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
        padding-top: 5.5rem;
      }
      .brand-logo {
        position: fixed !important;
        top: 1rem !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
      }
      .auth-card {
        margin-bottom: 2rem;
      }
    }
    .auth-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 2;
      overflow: hidden;
      animation: floatIn 0.5s ease forwards;
    }
    .brand-logo { z-index: 2; }
    @keyframes floatIn { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .tab-row { display:flex; border-bottom: 1px solid #f1f5f9; }
    .tab-btn {
      flex:1; padding:1.1rem; font-family:var(--font-body); font-size:0.875rem;
      font-weight:700; border:none; background:none; cursor:pointer; transition:all 0.2s;
      color: var(--color-text-muted);
    }
    .tab-btn.active { color:#fff; background: var(--color-primary-mid); }
    .panel { padding: 2rem; }
    .input-wrap { position:relative; }
    .input-wrap .icon { position:absolute; right:0.875rem; top:50%; transform:translateY(-50%); color:var(--color-text-subtle); font-size:1.1rem; pointer-events:none; }
    .input-wrap .icon.btn { pointer-events:auto; cursor:pointer; background:none; border:none; padding:0; }
  </style>
</head>
<body>
  <div class="blob" style="width:500px;height:500px;background:rgba(255,255,255,0.04);top:-150px;right:-100px;"></div>
  <div class="blob" style="width:300px;height:300px;background:rgba(232,93,4,0.1);bottom:-80px;left:30%;"></div>

  <!-- Brand above card -->
  <div class="brand-logo" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;">
    <a href="/index.html" style="display:flex;align-items:center;gap:0.625rem;text-decoration:none;">
      <div style="width:36px;height:36px;background:#e85d04;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(232,93,4,0.4);">
        <i class='bx bxs-car' style="color:#fff;font-size:1.125rem;"></i>
      </div>
      <span style="color:#fff;font-weight:800;font-size:1.25rem;">Easy<span style="color:#fb923c;">Car</span></span>
    </a>
  </div>

  <div class="auth-card">
    <!-- Tabs -->
    <div class="tab-row">
      <button id="tabLogin"    onclick="showTab('login')"    class="tab-btn active">Masuk</button>
      <button id="tabRegister" onclick="showTab('register')" class="tab-btn">Daftar</button>
    </div>

    <!-- LOGIN -->
    <div id="panelLogin" class="panel">
      <h2 style="font-size:1.125rem;font-weight:700;color:var(--color-primary);margin:0 0 0.25rem;">Selamat Datang Kembali</h2>
      <p style="font-size:0.8125rem;color:var(--color-text-muted);margin:0 0 1.5rem;">Masuk untuk melanjutkan perjalanan Anda</p>

      <div id="loginError" style="display:none;background:#fef2f2;color:#dc2626;border-radius:10px;padding:0.75rem 1rem;font-size:0.8125rem;font-weight:500;margin-bottom:1rem;"></div>

      <div style="display:flex;flex-direction:column;gap:1rem;">
        <div>
          <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:0.4rem;">Email</label>
          <div class="input-wrap">
            <input type="email" id="loginEmail" class="ec-input" placeholder="email@contoh.com" style="padding-right:2.5rem;" />
            <i class="bx bxs-envelope icon"></i>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:0.4rem;">Password</label>
          <div class="input-wrap">
            <input type="password" id="loginPass" class="ec-input" placeholder="••••••••" style="padding-right:2.5rem;"
              onkeydown="if(event.key==='Enter') doLogin()" />
            <button class="icon btn" onclick="togglePw('loginPass',this)"><i class='bx bx-hide'></i></button>
          </div>
        </div>
        <div style="text-align:right;">
          <button onclick="openForgot()" style="background:none;border:none;font-family:var(--font-body);font-size:0.75rem;font-weight:600;color:var(--color-primary-mid);cursor:pointer;">Lupa password?</button>
        </div>
      </div>

      <button id="loginBtn" onclick="doLogin()" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:1.5rem;padding:0.875rem;">
        Masuk ke Akun
      </button>

      <p style="text-align:center;font-size:0.75rem;color:var(--color-text-muted);margin-top:1.25rem;">
        Belum punya akun?
        <button onclick="showTab('register')" style="background:none;border:none;font-family:var(--font-body);font-size:0.75rem;font-weight:700;color:var(--color-primary-mid);cursor:pointer;margin-left:0.25rem;">Daftar sekarang</button>
      </p>
    </div>

    <!-- REGISTER -->
    <div id="panelRegister" class="panel" style="display:none;">
      <h2 style="font-size:1.125rem;font-weight:700;color:var(--color-primary);margin:0 0 0.25rem;">Buat Akun Baru</h2>
      <p style="font-size:0.8125rem;color:var(--color-text-muted);margin:0 0 1.5rem;">Daftar gratis dan mulai booking</p>

      <div id="regError"   style="display:none;background:#fef2f2;color:#dc2626;border-radius:10px;padding:0.75rem 1rem;font-size:0.8125rem;font-weight:500;margin-bottom:1rem;"></div>
      <div id="regSuccess" style="display:none;background:#f0fdf4;color:#15803d;border-radius:10px;padding:0.75rem 1rem;font-size:0.8125rem;font-weight:500;margin-bottom:1rem;"></div>

      <div style="display:flex;flex-direction:column;gap:1rem;">
        <div>
          <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:0.4rem;">Nama Lengkap</label>
          <div class="input-wrap">
            <input type="text" id="regName" class="ec-input" placeholder="Nama sesuai KTP" style="padding-right:2.5rem;" />
            <i class="bx bxs-user icon"></i>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:0.4rem;">Email</label>
          <div class="input-wrap">
            <input type="email" id="regEmail" class="ec-input" placeholder="email@contoh.com" style="padding-right:2.5rem;" />
            <i class="bx bxs-envelope icon"></i>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--color-text);margin-bottom:0.4rem;">Password</label>
          <div class="input-wrap">
            <input type="password" id="regPass" class="ec-input" placeholder="Minimal 6 karakter" style="padding-right:2.5rem;" />
            <button class="icon btn" onclick="togglePw('regPass',this)"><i class='bx bx-hide'></i></button>
          </div>
        </div>
      </div>

      <button id="regBtn" onclick="doRegister()" class="btn btn-accent" style="width:100%;justify-content:center;margin-top:1.5rem;padding:0.875rem;">
        Buat Akun
      </button>

      <p style="text-align:center;font-size:0.75rem;color:var(--color-text-muted);margin-top:1.25rem;">
        Sudah punya akun?
        <button onclick="showTab('login')" style="background:none;border:none;font-family:var(--font-body);font-size:0.75rem;font-weight:700;color:var(--color-primary-mid);cursor:pointer;margin-left:0.25rem;">Masuk sekarang</button>
      </p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="fpOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:#fff;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,0.25);width:100%;max-width:380px;padding:1.75rem;">
      <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--color-primary);margin:0 0 0.5rem;">🔑 Lupa Password?</h3>
      <p style="font-family:var(--font-body);font-size:0.8125rem;color:var(--color-text-muted);margin:0 0 1.25rem;">Masukkan email. Kami akan mengirimkan link reset password.</p>
      <input type="email" id="fpEmail" class="ec-input" placeholder="email@contoh.com" style="margin-bottom:0.75rem;" />
      <div id="fpMsg" style="display:none;border-radius:10px;padding:0.625rem 0.875rem;font-size:0.8125rem;font-weight:500;margin-bottom:0.875rem;"></div>
      <div style="display:flex;gap:0.75rem;">
        <button onclick="closeForgot()" class="btn btn-ghost" style="flex:1;justify-content:center;">Batal</button>
        <button id="fpBtn" onclick="sendReset()" class="btn btn-primary" style="flex:1;justify-content:center;">Kirim Link</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/services/supabase.js"></script>

  <script>
    // ── Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const tabParam  = urlParams.get("tab");
    const redirect  = urlParams.get("redirect");

    // Auto-redirect if already logged in
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const user = await getCurrentUser();
        redirectAfterLogin(user);
      }
    })();

    if (tabParam === "register") showTab("register");

    function showTab(tab) {
      const isLogin = tab === "login";
      document.getElementById("panelLogin").style.display    = isLogin ? "block" : "none";
      document.getElementById("panelRegister").style.display = isLogin ? "none" : "block";
      document.getElementById("tabLogin").className    = "tab-btn" + (isLogin ? " active" : "");
      document.getElementById("tabRegister").className = "tab-btn" + (isLogin ? "" : " active");
    }

    function redirectAfterLogin(user) {
      if (redirect) {
        window.location.href = decodeURIComponent(redirect);
        return;
      }
      if (user?.role === "admin") {
        window.location.href = "/pages/admin/dashboard.html";
      } else {
        window.location.href = "/pages/user/dashboard.html";
      }
    }

    async function doLogin() {
      const btn  = document.getElementById("loginBtn");
      const errEl = document.getElementById("loginError");
      const email = document.getElementById("loginEmail").value.trim();
      const pass  = document.getElementById("loginPass").value;

      errEl.style.display = "none";
      setButtonLoading(btn, true);

      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });

      if (error) {
        let msg = error.message.includes("Invalid login credentials")
          ? "Email atau password salah."
          : error.message.includes("Email not confirmed")
          ? "Email belum dikonfirmasi. Cek inbox Anda."
          : error.message;
        errEl.textContent = msg;
        errEl.style.display = "block";
        setButtonLoading(btn, false);
        return;
      }

      const user = await getCurrentUser();
      redirectAfterLogin(user);
    }

    async function doRegister() {
      const btn      = document.getElementById("regBtn");
      const errEl    = document.getElementById("regError");
      const successEl = document.getElementById("regSuccess");
      const name  = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pass  = document.getElementById("regPass").value;

      errEl.style.display    = "none";
      successEl.style.display = "none";

      if (!name || !email || !pass) {
        errEl.textContent = "Lengkapi semua field.";
        errEl.style.display = "block";
        return;
      }
      if (pass.length < 6) {
        errEl.textContent = "Password minimal 6 karakter.";
        errEl.style.display = "block";
        return;
      }

      setButtonLoading(btn, true);

      const { error } = await supabase.auth.signUp({
        email, password: pass,
        options: { data: { full_name: name, role: "user" } }
      });

      setButtonLoading(btn, false);

      if (error) {
        errEl.textContent = error.message.includes("already registered")
          ? "Email sudah terdaftar. Silahkan masuk."
          : error.message;
        errEl.style.display = "block";
        return;
      }

      successEl.textContent = "✅ Akun berhasil dibuat! Cek email untuk konfirmasi, lalu masuk.";
      successEl.style.display = "block";
      setTimeout(() => showTab("login"), 3000);
    }

    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const icon  = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.className = "bx bx-show";
      } else {
        input.type = "password";
        icon.className = "bx bx-hide";
      }
    }

    function openForgot() {
      const ov = document.getElementById("fpOverlay");
      document.getElementById("fpEmail").value = document.getElementById("loginEmail").value || "";
      document.getElementById("fpMsg").style.display = "none";
      ov.style.display = "flex";
    }
    function closeForgot() {
      document.getElementById("fpOverlay").style.display = "none";
    }
    document.getElementById("fpOverlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeForgot();
    });

    async function sendReset() {
      const email = document.getElementById("fpEmail").value.trim();
      const msgEl = document.getElementById("fpMsg");
      const btn   = document.getElementById("fpBtn");
      if (!email) {
        msgEl.textContent = "Masukkan email terlebih dahulu.";
        msgEl.style.cssText = "display:block;background:#fef2f2;color:#dc2626;border-radius:10px;padding:0.625rem 0.875rem;font-size:0.8125rem;font-weight:500;margin-bottom:0.875rem;";
        return;
      }
      setButtonLoading(btn, true);
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/pages/user/profile.html"
      });
      setButtonLoading(btn, false);
      if (error) {
        msgEl.textContent = "Gagal: " + error.message;
        msgEl.style.cssText = "display:block;background:#fef2f2;color:#dc2626;border-radius:10px;padding:0.625rem 0.875rem;font-size:0.8125rem;font-weight:500;margin-bottom:0.875rem;";
      } else {
        msgEl.textContent = "✅ Link reset dikirim! Cek email Anda (termasuk folder spam).";
        msgEl.style.cssText = "display:block;background:#f0fdf4;color:#15803d;border-radius:10px;padding:0.625rem 0.875rem;font-size:0.8125rem;font-weight:500;margin-bottom:0.875rem;";
        setTimeout(closeForgot, 4000);
      }
    }

    // Button loading helper (no ui.js on this page)
    function setButtonLoading(btn, loading) {
      if (loading) {
        btn.dataset.orig = btn.innerHTML;
        btn.innerHTML = `<span style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle;"></span>Memproses...`;
        btn.disabled = true;
      } else {
        btn.innerHTML = btn.dataset.orig;
        btn.disabled  = false;
      }
    }
    const spinStyle = document.createElement("style");
    spinStyle.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
    document.head.appendChild(spinStyle);
  </script>
</body>
</html>
