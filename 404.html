<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyCar — Halaman Tidak Ditemukan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:var(--color-bg);">
  <div style="text-align:center;max-width:440px;">
    <div style="font-size:6rem;font-weight:800;color:var(--color-border);line-height:1;margin-bottom:0.5rem;letter-spacing:-4px;">404</div>
    <div style="width:72px;height:72px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:1px solid var(--color-border);">
      <i class='bx bxs-car' style="font-size:2.25rem;color:var(--color-accent);"></i>
    </div>
    <h1 style="font-size:1.375rem;font-weight:800;color:var(--color-primary);margin:0 0 0.5rem;">Halaman Tidak Ditemukan</h1>
    <p style="color:var(--color-text-muted);font-size:0.875rem;margin:0 0 2rem;line-height:1.7;">
      Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan ke alamat lain.
    </p>
    <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
      <a href="/index.html" class="btn btn-primary">
        <i class='bx bxs-home'></i> Beranda
      </a>
      <button onclick="history.back()" class="btn btn-ghost">
        <i class='bx bx-arrow-back'></i> Kembali
      </button>
    </div>
  </div>
</body>
</html>
